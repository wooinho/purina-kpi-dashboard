function renderUpload(){
  var pg = document.getElementById("page-upload");
  pg.innerHTML = "";

  pg.appendChild(el("div","banner info","<span class='bi'>ℹ️</span><div>업로드한 CSV/엑셀은 이 브라우저에서 바로 분석·검증된 뒤, <b>승인하면 모두에게 공유되는 대시보드로 게시</b>됩니다(같은 링크를 보는 모든 사람이 최신 데이터를 보게 됩니다). 같은 파일을 다시 올려도 중복 적재되지 않습니다. <b>엑셀(.xlsx)</b>은 와일리 Media Master 형식('Media' 시트 → Brand Media 화면) 또는 썸트렌드 언급량 형식('언급량' 시트 → Buzz SOV 화면)을 자동으로 인식합니다.</div>"));

  var p1 = el("div","panel");
  p1.appendChild(el("div","panel-title","1. 파일 선택"));
  var dropZone = el("div");
  dropZone.style.cssText = "border:2px dashed var(--line-strong); border-radius:12px; padding:28px; text-align:center; color:var(--ink-muted); cursor:pointer;";
  dropZone.innerHTML = "CSV 또는 Media Master 엑셀(.xlsx) 파일을 여기로 드래그하거나 클릭해서 선택하세요";
  var fileInput = el("input"); fileInput.type = "file"; fileInput.accept = ".csv,.xlsx"; fileInput.style.display = "none";
  dropZone.addEventListener("click", function(){ fileInput.click(); });
  dropZone.addEventListener("dragover", function(e){ e.preventDefault(); dropZone.style.background = "var(--surface-alt)"; });
  dropZone.addEventListener("dragleave", function(){ dropZone.style.background = ""; });
  dropZone.addEventListener("drop", function(e){
    e.preventDefault(); dropZone.style.background = "";
    if(e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
  });
  fileInput.addEventListener("change", function(){ if(fileInput.files.length) handleFile(fileInput.files[0]); });
  p1.appendChild(dropZone); p1.appendChild(fileInput);
  pg.appendChild(p1);

  var workArea = el("div"); pg.appendChild(workArea);

  function handleFile(file){
    workArea.innerHTML = "";
    var statusEl = el("div","panel-sub","읽는 중...");
    workArea.appendChild(statusEl);
    if(/\.xlsx$/i.test(file.name)){
      handleXlsxFile(file, statusEl);
      return;
    }
    readFileSmart(file).then(function(res){
      var parsed = parseCSVText(res.text);
      if(!parsed.header.length || !parsed.rows.length){
        statusEl.textContent = "❌ 오류: 빈 파일이거나 헤더를 인식할 수 없습니다.";
        return;
      }
      var uploadType = detectUploadType(parsed.header);
      renderPreview(file, res, parsed, uploadType, statusEl);
    }).catch(function(err){
      statusEl.textContent = "❌ 오류: 파일을 읽을 수 없습니다 (" + err + ")";
    });
  }

  function handleXlsxFile(file, statusEl){
    if(typeof XLSX === "undefined"){
      statusEl.textContent = "❌ 오류: 엑셀 파싱 라이브러리를 불러오지 못했습니다. 새로고침 후 다시 시도해주세요.";
      return;
    }
    var reader = new FileReader();
    reader.onload = function(e){
      var wb;
      try{
        wb = XLSX.read(new Uint8Array(e.target.result), {type:"array"});
      }catch(err){
        statusEl.textContent = "❌ 오류: 엑셀 파일을 읽을 수 없습니다 (" + err + ")";
        return;
      }
      if(wb.SheetNames.indexOf("언급량") !== -1){
        var records2;
        try{
          var rows2D2 = XLSX.utils.sheet_to_json(wb.Sheets["언급량"], {header:1, raw:true, defval:null});
          var uploadedAt2 = new Date().toISOString().slice(0,19).replace("T"," ");
          var parsed2 = parseSometrendMentions(rows2D2, file.name, uploadedAt2);
          if(!parsed2.brand){
            statusEl.textContent = "❌ 오류: '● 주제어' 값을 찾지 못해 브랜드/카테고리명을 알 수 없습니다.";
            return;
          }
          records2 = parsed2.records;
        }catch(err2){
          statusEl.textContent = "❌ 오류: 썸트렌드 파일을 읽을 수 없습니다 (" + err2 + ")";
          return;
        }
        if(!records2.length){
          statusEl.textContent = "❌ 오류: 인식된 데이터 행이 없습니다. '언급량' 시트 구조(날짜/합계/커뮤니티/인스타그램/블로그/뉴스 열)를 확인해주세요.";
          return;
        }
        renderSometrendPreview(file, records2, statusEl);
        return;
      }
      if(wb.SheetNames.indexOf("Media") === -1){
        statusEl.textContent = "❌ 오류: 'Media' 시트도 '언급량' 시트도 찾을 수 없습니다. 와일리 Media Master 또는 썸트렌드 언급량 형식의 파일인지 확인해주세요. (시트 목록: " + wb.SheetNames.join(", ") + ")";
        return;
      }
      var records;
      try{
        var rows2D = XLSX.utils.sheet_to_json(wb.Sheets["Media"], {header:1, raw:true, defval:null});
        var uploadedAt = new Date().toISOString().slice(0,19).replace("T"," ");
        records = parseMediaMasterRows(rows2D, file.name, uploadedAt);
      }catch(err){
        statusEl.textContent = "❌ 오류: 엑셀 파일을 읽을 수 없습니다 (" + err + ")";
        return;
      }
      if(!records.length){
        statusEl.textContent = "❌ 오류: 인식된 데이터 행이 없습니다. 'Media' 시트 구조(Date/Campaign/Funnel/Media/Spending 열)를 확인해주세요.";
        return;
      }
      renderXlsxPreview(file, records, statusEl);
    };
    reader.onerror = function(){ statusEl.textContent = "❌ 오류: 파일을 읽을 수 없습니다."; };
    reader.readAsArrayBuffer(file);
  }

  function renderSometrendPreview(file, records, statusEl){
    workArea.innerHTML = "";
    var brand = records[0].brand;
    var dates = records.map(function(r){return r.date;}).sort();
    var isKnownBrand = SOV_BRANDS.indexOf(brand) !== -1;

    var p2 = el("div","panel");
    p2.appendChild(el("div","panel-title","2. 인식 결과 (썸트렌드 언급량 형식)"));
    p2.appendChild(el("div","panel-sub", records.length+"행 · 기간 "+dates[0]+" ~ "+dates[dates.length-1]+" · 주제어: "+brand+
      (isKnownBrand ? " (브랜드로 인식됨)" : " (경쟁 브랜드 목록에 없어 카테고리 전체 기준값으로 취급됩니다)")));
    workArea.appendChild(p2);

    var p3 = el("div","panel");
    p3.appendChild(el("div","panel-title","3. 미리보기 (상위 10행)"));
    var wt = el("div"); p3.appendChild(wt);
    renderSortableTable(wt, records.slice(0,10), [
      ["date","날짜","text"],["total","합계","count"],["community","커뮤니티","count"],
      ["instagram","인스타그램","count"],["blog","블로그","count"],["news","뉴스","count"]
    ]);
    workArea.appendChild(p3);

    var p5 = el("div","panel");
    p5.appendChild(el("div","panel-title","4. 최종 업로드 승인"));
    p5.appendChild(el("div","panel-sub","소스 파일: "+file.name+" · 적재 대상: "+records.length+"건 (Buzz SOV 화면에 반영됩니다)"));
    var approveBtn = el("div","btn primary","✅ 이 데이터를 대시보드에 적재하고 모두에게 게시");
    p5.appendChild(approveBtn);
    var publishStatus = el("div","foot-note"); p5.appendChild(publishStatus);
    workArea.appendChild(p5);

    approveBtn.addEventListener("click", function(){
      approveBtn.textContent = "적재 중...";
      var mergeResult = mergeDedup(buzzMentionRows, records);
      buzzMentionRows = mergeResult.merged;
      uploadHistory.unshift({
        upload_type: "buzz_mentions", source_file: file.name, uploaded_at: records[0].uploaded_at,
        period_start: dates[0], period_end: dates[dates.length-1],
        raw_row_count: records.length, loaded_row_count: mergeResult.addedCount, duplicate_row_count: mergeResult.dupCount,
        error_row_count: 0, warning_row_count: 0, unmapped_campaign_count: 0
      });
      approveBtn.textContent = "게시하는 중...";
      publishStatus.textContent = "";
      publishUpdatedData().then(function(res){
        if(res.ok){
          publishStatus.textContent = "✅ 적재 완료 — 신규 " + mergeResult.addedCount + "행, 중복 스킵 " + mergeResult.dupCount +

        RENDERERS.buzzsov();
      });
    });
  }

    var approveBtn = el("div","btn primary","✅ 이 데이터를 대시보드에 적재하고 모두에게 게시");

        upload_type: "brand_media", source_file: file.name, uploaded_at: records[0].uploaded_at,

      });

      publishUpdatedData().then(function(res){

            "행. 모두에게 공유된 최신 버전으로 곧 새로고침됩니다...";
          publishStatus.style.color = "var(--good)";
        } else {
          publishStatus.textContent = "⚠️ " + res.reason;
          publishStatus.style.color = "var(--warning)";
        }
        approveBtn.textContent = "✅ 이 데이터를 대시보드에 적재하고 모두에게 게시";
        var updatedBadge = document.getElementById("updatedBadge");
        if(updatedBadge) updatedBadge.textContent = "데이터 최종 갱신일: " + new Date().toISOString().slice(0,19).replace("T"," ");
        RENDERERS.brandmedia();
      });

  }

  function renderPreview(file, res, parsed, uploadType, statusEl){
    workArea.innerHTML = "";
    var p2 = el("div","panel");
    p2.appendChild(el("div","panel-title","2. 인식 결과"));
    p2.appendChild(el("div","panel-sub","인코딩: "+res.encoding+" · 행: "+parsed.rows.length+" · 열: "+parsed.header.length));

    var typeRow = el("div","ffield"); typeRow.innerHTML = "<label>업로드 유형</label>";
    var typeSel = el("select");
    [["자동 감지 결과: "+(uploadType==="mall_conversion"?"자사몰 전환 데이터":uploadType==="ad_performance"?"광고 성과 데이터":"판별 불가"), uploadType],
     ["자사몰 전환 데이터로 처리","mall_conversion"], ["광고 성과 데이터로 처리","ad_performance"]].forEach(function(o){
      var op = el("option","",o[0]); op.value = o[1]; typeSel.appendChild(op);
    });
    var ctl = el("div","ctl"); ctl.appendChild(typeSel); typeRow.appendChild(ctl);
    p2.appendChild(typeRow);
    workArea.appendChild(p2);

    var previewPanel = el("div","panel");
    previewPanel.appendChild(el("div","panel-title","3. 원본 미리보기 (상위 10행)"));
    var pcols = parsed.header.map(function(h){return [h,h,"text"];});
    var pTblWrap = el("div"); previewPanel.appendChild(pTblWrap);
    renderSortableTable(pTblWrap, parsed.rows.slice(0,10).map(function(r,i){return Object.assign({_i:i},r);}), pcols);
    workArea.appendChild(previewPanel);

    var periodPanel = el("div","panel"); periodPanel.style.display = "none";
    var periodStartInput = el("input"); periodStartInput.type = "date";
    var periodEndInput = el("input"); periodEndInput.type = "date";
    function updatePeriodVisibility(){
      var show = typeSel.value === "mall_conversion";
      periodPanel.style.display = show ? "" : "none";
    }
    periodPanel.appendChild(el("div","panel-title","4. 데이터 기간 지정 (자사몰 CSV에는 날짜가 없습니다)"));
    periodPanel.appendChild(el("div","panel-sub","이 파일이 대표하는 기간을 입력하세요. 예: 2026-08-01 ~ 2026-08-31"));
    var prow = el("div","filters-row"); prow.style.padding = "0";
    var f1 = el("div","ffield"); f1.innerHTML = "<label>시작일</label>"; var c1 = el("div","ctl"); c1.appendChild(periodStartInput); f1.appendChild(c1);
    var f2 = el("div","ffield"); f2.innerHTML = "<label>종료일</label>"; var c2 = el("div","ctl"); c2.appendChild(periodEndInput); f2.appendChild(c2);
    prow.appendChild(f1); prow.appendChild(f2);
    periodPanel.appendChild(prow);
    workArea.appendChild(periodPanel);
    updatePeriodVisibility();
    typeSel.addEventListener("change", updatePeriodVisibility);

    var runBtn = el("div","btn primary","검증 실행 →");
    var runWrap = el("div"); runWrap.style.cssText = "margin-top:4px;"; runWrap.appendChild(runBtn);
    workArea.appendChild(runWrap);

    var resultArea = el("div"); workArea.appendChild(resultArea);

    runBtn.addEventListener("click", function(){
      var type = typeSel.value;
      if(type !== "mall_conversion" && type !== "ad_performance"){
        resultArea.innerHTML = "<div class='banner warn'>⚠️ 업로드 유형을 판별할 수 없습니다. 위에서 직접 선택해주세요.</div>";
        return;
      }
      if(type === "mall_conversion" && (!periodStartInput.value || !periodEndInput.value)){
        resultArea.innerHTML = "<div class='banner warn'>⚠️ 기간(시작일/종료일)을 입력해주세요.</div>";
        return;
      }
      runValidation(file, parsed, type, periodStartInput.value, periodEndInput.value, resultArea);
    });
  }

  function runValidation(file, parsed, type, periodStart, periodEnd, resultArea){
    resultArea.innerHTML = "";
    var vr = type === "mall_conversion" ? validateMallRows(parsed.header, parsed.rows) : validateAdRows(parsed.header, parsed.rows);
    if(!vr.ok){
      if(vr.missingColumns) resultArea.appendChild(el("div","banner warn","❌ 필수 컬럼 누락: "+vr.missingColumns.join(", ")+" — 이 파일은 적재할 수 없습니다."));
      else if(vr.empty) resultArea.appendChild(el("div","banner warn","❌ 정상 데이터 행이 없습니다."));
      return;
    }

    var p3 = el("div","panel");
    p3.appendChild(el("div","panel-title","5. 검증 결과"));
    var tiles = el("div","stat-tile-row");
    [["정상 행", vr.clean.length, "good"], ["오류 행", vr.errors.length, "critical"],
     ["경고 행", vr.warnings.length, "warning"], ["확인 필요", vr.reviews.length, "insufficient"]].forEach(function(t){
      var tile = el("div","stat-tile"); tile.innerHTML = "<div class='n' style='color:var(--"+t[2]+")'>"+t[1]+"</div><div class='l'>"+t[0]+"</div>";
      tiles.appendChild(tile);
    });
    p3.appendChild(tiles);
    resultArea.appendChild(p3);

    if(vr.errors.length){
      var pe = el("div","panel"); pe.appendChild(el("div","panel-title","🔴 오류 행 (적재되지 않음)"));
      var errRows = vr.errors.slice(0,30).map(function(e){ return Object.assign({_reason:e.reason}, e.row); });
      var wte = el("div"); pe.appendChild(wte);
      renderSortableTable(wte, errRows, [["_reason","이유","text"]].concat(parsed.header.slice(0,6).map(function(h){return [h,h,"text"];})));
      resultArea.appendChild(pe);
    }
    if(vr.warnings.length){
      var pw = el("div","panel"); pw.appendChild(el("div","panel-title","🟡 경고 행 (적재는 됨)"));
      var warnRows = vr.warnings.slice(0,30).map(function(e){ return Object.assign({_reason:e.reason}, e.row); });
      var wtw = el("div"); pw.appendChild(wtw);
      renderSortableTable(wtw, warnRows, [["_reason","이유","text"]].concat(parsed.header.slice(0,6).map(function(h){return [h,h,"text"];})));
      resultArea.appendChild(pw);
    }

    if(!vr.clean.length){
      resultArea.appendChild(el("div","banner warn","정상 처리 가능한 행이 없습니다. 업로드를 중단합니다."));
      return;
    }

    var uploadedAt = new Date().toISOString().slice(0,19).replace("T"," ");
    var stdRows, codeField;
    if(type === "mall_conversion"){
      stdRows = buildMallConversionClean(vr.clean, periodStart, periodEnd, file.name, uploadedAt);
      codeField = "campaign_code";
    } else {
      stdRows = buildAdPerformanceClean(vr.clean, file.name, uploadedAt);
      codeField = "campaign_code";
    }

    var p4 = el("div","panel");
    p4.appendChild(el("div","panel-title","6. 캠페인 퍼널 분류 미리보기"));
    var funnelCounts = {};
    stdRows.forEach(function(r){ funnelCounts[r.funnel_stage] = (funnelCounts[r.funnel_stage]||0)+1; });
    var fc = el("div","stat-tile-row");
    ALL_FUNNELS.forEach(function(f){
      var tile = el("div","stat-tile");
      tile.innerHTML = "<div class='n'>"+(funnelCounts[f]||0)+"</div><div class='l'>"+FUNNEL_LABEL[f]+"</div>";
      fc.appendChild(tile);
    });
    p4.appendChild(fc);
    var unmapped = Array.from(new Set(stdRows.filter(function(r){return !r.funnel_mapped;}).map(function(r){return r[codeField];})));
    if(unmapped.length){
      p4.appendChild(el("div","sample-warn","⚠️ UNMAPPED 캠페인 "+unmapped.length+"건: "+unmapped.slice(0,20).join(", ")+(unmapped.length>20?" 외 "+(unmapped.length-20)+"건":"")));
    }
    resultArea.appendChild(p4);

    var p5 = el("div","panel");
    p5.appendChild(el("div","panel-title","7. 최종 업로드 승인"));
    p5.appendChild(el("div","panel-sub","소스 파일: "+file.name+" · 적재 대상: "+stdRows.length+"건"));
    var approveBtn = el("div","btn primary","✅ 이 데이터를 대시보드에 적재하고 모두에게 게시");
    p5.appendChild(approveBtn);
    var publishStatus = el("div","foot-note"); p5.appendChild(publishStatus);
    resultArea.appendChild(p5);

    approveBtn.addEventListener("click", function(){
      approveBtn.textContent = "적재 중...";
      var mergeResult, unmappedCount;
      if(type === "mall_conversion"){
        mergeResult = mergeDedup(mallRows, stdRows);
        mallRows = mergeResult.merged;
      } else {
        mergeResult = mergeDedup(adRows, stdRows);
        adRows = mergeResult.merged;
      }
      unmappedCount = unmapped.length;
      uploadHistory.unshift({
        upload_type: type, source_file: file.name, uploaded_at: uploadedAt,
        period_start: type==="mall_conversion" ? periodStart : (stdRows.length?stdRows.map(function(r){return r.date;}).sort()[0]:null),
        period_end: type==="mall_conversion" ? periodEnd : (stdRows.length?stdRows.map(function(r){return r.date;}).sort().slice(-1)[0]:null),
        raw_row_count: parsed.rows.length, loaded_row_count: mergeResult.addedCount, duplicate_row_count: mergeResult.dupCount,
        error_row_count: vr.errors.length, warning_row_count: vr.warnings.length, unmapped_campaign_count: unmappedCount
      });
      if(vr.errors.length) rejectedLog.push({severity:"오류", n:vr.errors.length});
      if(vr.warnings.length) rejectedLog.push({severity:"경고", n:vr.warnings.length});
      if(vr.reviews.length) rejectedLog.push({severity:"확인 필요", n:vr.reviews.length});

      rebuildMart();
      // 새로 업로드된 기간이 현재 선택된 필터 범위 밖이면, 화면에 바로 보이도록 종료일을 확장한다
      // (선택 범위를 줄이지는 않음 - 사용자가 좁혀둔 필터를 임의로 되돌리지 않기 위함).
      var newMax = ALL_MONTHS[ALL_MONTHS.length-1];
      if(newMax && newMax > state.end) state.end = newMax;
      buildFiltersUI();
      approveBtn.textContent = "게시하는 중...";
      publishStatus.textContent = "";
      publishUpdatedData().then(function(res){
        if(res.ok){
          // 성공 시 플랫폼이 이 화면을 최신 버전으로 자동 새로고침합니다(문서 정책).
          publishStatus.textContent = "✅ 적재 완료 — 신규 " + mergeResult.addedCount + "행, 중복 스킵 " + mergeResult.dupCount +
            "행, 미분류 " + unmappedCount + "건. 모두에게 공유된 최신 버전으로 곧 새로고침됩니다...";
          publishStatus.style.color = "var(--good)";
        } else {
          publishStatus.textContent = "⚠️ " + res.reason;
          publishStatus.style.color = "var(--warning)";
        }
        approveBtn.textContent = "✅ 이 데이터를 대시보드에 적재하고 모두에게 게시";
        var updatedBadge = document.getElementById("updatedBadge");
        if(updatedBadge) updatedBadge.textContent = "데이터 최종 갱신일: " + new Date().toISOString().slice(0,19).replace("T"," ");
        // 업로드 화면 자체는 다시 그리지 않고(방금 띄운 메시지 보존), 나머지 화면만 새 데이터로 갱신합니다.
        ["executive","funnel","media","cross","quality"].forEach(function(p){ RENDERERS[p](); });
      });
    });
  }
}

/* ============================== nav & orchestration ============================== */
var RENDERERS = {upload: renderUpload, executive: renderExecutive, funnel: renderFunnel, media: renderMedia, cross: renderCross, brandmedia: renderBrandMedia, sov: renderSov, buzzsov: renderBuzzSov, quality: renderQuality};
function renderAll(){
  var active = q(".rail-item.active").getAttribute("data-page");
  RENDERERS[active]();
}
qa(".rail-item").forEach(function(item){
  item.addEventListener("click", function(){
    qa(".rail-item").forEach(function(i){i.classList.remove("active");});
    item.classList.add("active");
    var page = item.getAttribute("data-page");
    qa(".page").forEach(function(p){p.classList.remove("active");});
    document.getElementById("page-"+page).classList.add("active");
    document.getElementById("pageTitle").textContent = PAGE_META[page][0];
    document.getElementById("pageDesc").textContent = PAGE_META[page][1];
    RENDERERS[page]();
  });
});

qa("#themeToggle button").forEach(function(btn){
  btn.addEventListener("click", function(){
    qa("#themeToggle button").forEach(function(b){b.classList.remove("active");});
    btn.classList.add("active");
    var t = btn.getAttribute("data-theme");
    if(t==="system") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", t);
  });
});

document.getElementById("updatedBadge").textContent = DATA.lastUpdated ? ("데이터 최종 갱신일: " + DATA.lastUpdated) : "";

buildFiltersUI();
renderAll();
window.addEventListener("resize", function(){ renderAll(); });
}catch(__initErr){
  console.error("대시보드 초기화 중 오류:", __initErr);
}
})();
