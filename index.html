<meta charset="utf-8">
<title>퓨리나몰 KPI 대시보드</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --ground:#FAF7F5; --surface:#FFFFFF; --surface-alt:#F1ECEA; --surface-sunken:#EDE6E4;
    --ink:#2A2320; --ink-muted:#6B6260; --ink-faint:#9A908C;
    --line:#E5DEDC; --line-strong:#D8CFCC;
    --accent:#D0102E; --accent-ink:#FFFFFF; --accent-soft:#F8DEE1; --accent-50:#FBEAEA; --accent-700:#9A0C22;
    --good:#1F7A49; --good-soft:#E3F2E9;
    --warning:#AD8600; --warning-soft:#FBF1DA;
    --critical:#B5432E; --critical-soft:#F8E4DE;
    --insufficient:#837A78; --insufficient-soft:#ECE8E6;
    --cat-awareness:#7B6EDB; --cat-consideration:#1F8FA8; --cat-conversion:#D0102E; --cat-unmapped:#9C9492;
    --tooltip-bg:#2A2320; --tooltip-ink:#FFFFFF;
    --shadow:0 1px 2px rgba(42,35,32,.06), 0 6px 18px rgba(42,35,32,.07);
    --radius-sm:6px; --radius-md:10px; --radius-lg:16px;
    --font-kr:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    --font-mono:ui-monospace,"SF Mono","Cascadia Mono","Consolas","Menlo",monospace;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --ground:#181514; --surface:#221D1C; --surface-alt:#2B2423; --surface-sunken:#171312;
      --ink:#F1E9E7; --ink-muted:#B8ADAA; --ink-faint:#877D7A;
      --line:#382F2D; --line-strong:#463B39;
      --accent:#FF5470; --accent-ink:#1B1110; --accent-soft:#43242B; --accent-50:#2B1A1D; --accent-700:#FF8098;
      --good:#2E9463; --good-soft:#17352A;
      --warning:#AE9200; --warning-soft:#3A2E14;
      --critical:#CF4A44; --critical-soft:#3B2118;
      --insufficient:#9C9492; --insufficient-soft:#2C2726;
      --cat-awareness:#8577E0; --cat-consideration:#2FA0B8; --cat-conversion:#FF5470; --cat-unmapped:#9C9492;
      --tooltip-bg:#F1E9E7; --tooltip-ink:#221D1C;
      --shadow:0 1px 2px rgba(0,0,0,.35), 0 8px 26px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"]{
    --ground:#181514; --surface:#221D1C; --surface-alt:#2B2423; --surface-sunken:#171312;
    --ink:#F1E9E7; --ink-muted:#B8ADAA; --ink-faint:#877D7A;
    --line:#382F2D; --line-strong:#463B39;
    --accent:#FF5470; --accent-ink:#1B1110; --accent-soft:#43242B; --accent-50:#2B1A1D; --accent-700:#FF8098;
    --good:#2E9463; --good-soft:#17352A;
    --warning:#AE9200; --warning-soft:#3A2E14;
    --critical:#CF4A44; --critical-soft:#3B2118;
    --insufficient:#9C9492; --insufficient-soft:#2C2726;
    --cat-awareness:#8577E0; --cat-consideration:#2FA0B8; --cat-conversion:#FF5470; --cat-unmapped:#9C9492;
    --tooltip-bg:#F1E9E7; --tooltip-ink:#221D1C;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 8px 26px rgba(0,0,0,.4);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ground); color:var(--ink); font-family:var(--font-kr);
    font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--accent-soft); color:var(--ink);}
  a{color:var(--accent);}
  button, select, input{font-family:inherit; font-size:inherit; color:inherit;}
  h1,h2,h3{text-wrap:balance; margin:0;}
  table{font-variant-numeric:tabular-nums;}

  .app{display:flex; min-height:100vh; width:100%;}

  /* ---------- Rail ---------- */
  .rail{
    width:216px; flex:0 0 216px; background:var(--surface); border-right:1px solid var(--line);
    padding:20px 12px; display:flex; flex-direction:column; gap:2px;
    position:sticky; top:0; align-self:flex-start; height:100vh; overflow-y:auto;
  }
  .rail-brand{display:flex; align-items:center; gap:10px; padding:6px 10px 18px;}
  .rail-brand .mark{
    width:30px; height:30px; border-radius:9px; background:var(--accent); color:var(--accent-ink);
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:15px; flex:0 0 auto;
  }
  .rail-brand .name{font-weight:700; font-size:14.5px; letter-spacing:-.01em;}
  .rail-brand .sub{font-size:11px; color:var(--ink-faint); margin-top:1px;}
  .rail-nav{display:flex; flex-direction:column; gap:2px; margin-top:4px;}
  .rail-item{
    display:flex; align-items:center; gap:10px; padding:9px 11px; border-radius:var(--radius-sm);
    cursor:pointer; color:var(--ink-muted); font-size:13.5px; font-weight:500; border:1px solid transparent;
    user-select:none;
  }
  .rail-item:hover{background:var(--surface-alt); color:var(--ink);}
  .rail-item.active{background:var(--accent-soft); color:var(--accent); font-weight:700;}
  .rail-item .ico{width:18px; height:18px; flex:0 0 auto; display:flex; align-items:center; justify-content:center;}
  .rail-item .ico svg{width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.7;}
  .rail-foot{margin-top:auto; padding:10px; font-size:11px; color:var(--ink-faint); border-top:1px solid var(--line);}
  .theme-toggle{
    display:flex; gap:4px; background:var(--surface-alt); padding:3px; border-radius:999px; margin-top:8px;
  }
  .theme-toggle button{
    flex:1; border:none; background:transparent; padding:5px 0; border-radius:999px; font-size:11px;
    color:var(--ink-muted); cursor:pointer;
  }
  .theme-toggle button.active{background:var(--surface); color:var(--ink); box-shadow:var(--shadow); font-weight:600;}

  /* ---------- Main ---------- */
  .main{flex:1; min-width:0; display:flex; flex-direction:column;}
  .topbar{
    position:sticky; top:0; z-index:20; background:var(--ground); padding:22px 30px 0;
    border-bottom:1px solid var(--line);
  }
  .topbar-head{display:flex; align-items:baseline; justify-content:space-between; gap:16px; flex-wrap:wrap;}
  .page-title{font-size:21px; font-weight:800; letter-spacing:-.015em;}
  .page-desc{font-size:12.5px; color:var(--ink-muted); margin-top:3px;}
  .updated-badge{font-size:11.5px; color:var(--ink-faint); white-space:nowrap; font-variant-numeric:tabular-nums;}

  .filters-row{display:flex; flex-wrap:wrap; gap:8px 10px; align-items:flex-end; padding:14px 0 14px;}
  .ffield{display:flex; flex-direction:column; gap:4px;}
  .ffield label{font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); font-weight:600;}
  .ffield .ctl{display:flex; gap:6px; align-items:center;}
  input[type="month"], input[type="number"], select, .msel-btn, input[type="search"]{
    background:var(--surface); border:1px solid var(--line-strong); border-radius:var(--radius-sm);
    padding:6px 9px; font-size:12.5px; color:var(--ink);
  }
  input[type="month"]{width:126px;}
  input[type="number"]{width:108px;}
  input[type="search"]{width:170px;}
  select{width:150px;}
  input:focus-visible, select:focus-visible, button:focus-visible, .msel-btn:focus-visible{
    outline:2px solid var(--accent); outline-offset:1px;
  }
  .msel{position:relative;}
  .msel-btn{cursor:pointer; min-width:130px; display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .msel-btn .count{background:var(--accent-soft); color:var(--accent); font-size:10.5px; font-weight:700; padding:1px 6px; border-radius:999px;}
  .msel-pop{
    position:absolute; top:calc(100% + 5px); left:0; background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius-md); box-shadow:var(--shadow); padding:6px; min-width:190px; max-height:240px;
    overflow-y:auto; z-index:30; display:none;
  }
  .msel.open .msel-pop{display:block;}
  .msel-opt{display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:var(--radius-sm); cursor:pointer; font-size:12.5px;}
  .msel-opt:hover{background:var(--surface-alt);}
  .msel-opt input{margin:0;}
  .reset-link{font-size:12px; color:var(--accent); cursor:pointer; font-weight:600; padding:6px 4px;}

  .content{padding:22px 30px 70px; display:flex; flex-direction:column; gap:22px; max-width:1400px;}
  .page{display:none;}
  .page.active{display:flex; flex-direction:column; gap:22px;}

  .banner{
    display:flex; gap:10px; align-items:flex-start; padding:12px 14px; border-radius:var(--radius-md);
    font-size:12.5px; line-height:1.55; border:1px solid var(--line);
  }
  .banner.warn{background:var(--warning-soft); color:var(--ink); border-color:transparent;}
  .banner.info{background:var(--surface-alt); color:var(--ink-muted);}
  .banner b{color:var(--ink); font-weight:700;}
  .banner .bi{flex:0 0 auto; font-size:15px; line-height:1;}

  .kpi-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(148px,1fr)); gap:10px;}
  .kpi-card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-md);
    padding:13px 14px 12px; box-shadow:var(--shadow); min-width:0;
  }
  .kpi-label{font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); font-weight:700;}
  .kpi-value{font-family:var(--font-mono); font-size:20px; font-weight:600; margin-top:6px; font-variant-numeric:tabular-nums; letter-spacing:-.01em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .kpi-delta{font-size:11px; margin-top:6px; display:flex; align-items:center; gap:4px; font-variant-numeric:tabular-nums;}
  .kpi-delta.up{color:var(--good);} .kpi-delta.down{color:var(--critical);} .kpi-delta.flat{color:var(--ink-faint);}

  .panel-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  @media (max-width:900px){.panel-grid{grid-template-columns:1fr;}}
  .panel{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg);
    padding:16px 18px 18px; box-shadow:var(--shadow); min-width:0;
  }
  .panel-title{font-size:13.5px; font-weight:700;}
  .panel-sub{font-size:11.5px; color:var(--ink-muted); margin-top:2px; margin-bottom:12px;}
  .legend{display:flex; flex-wrap:wrap; gap:10px 14px; font-size:11.5px; color:var(--ink-muted); margin-top:10px;}
  .legend-item{display:flex; align-items:center; gap:6px;}
  .legend-dot{width:9px; height:9px; border-radius:3px; flex:0 0 auto;}

  .table-wrap{overflow-x:auto; border-radius:var(--radius-sm);}
  table{width:100%; border-collapse:collapse; font-size:12.5px; min-width:560px;}
  thead th{
    text-align:right; font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-faint);
    padding:8px 10px; border-bottom:1px solid var(--line-strong); white-space:nowrap; cursor:pointer; font-weight:700;
    background:var(--surface); position:sticky; top:0;
  }
  thead th:first-child, td:first-child{text-align:left;}
  thead th.sorted{color:var(--accent);}
  thead th .arrow{font-size:9px; margin-left:2px;}
  tbody td{padding:7px 10px; border-bottom:1px solid var(--line); text-align:right; white-space:nowrap;}
  tbody tr:hover td{background:var(--surface-alt);}
  .num-na{color:var(--ink-faint);}
  .code-cell{font-family:var(--font-mono); font-size:11.5px;}

  .chip{display:inline-flex; align-items:center; gap:6px; padding:3px 10px 3px 8px; border-radius:999px; font-size:11.5px; font-weight:700; white-space:nowrap;}
  .chip .dot{width:7px; height:7px; border-radius:50%; flex:0 0 auto;}
  .chip.good{background:var(--good-soft); color:var(--good);}
  .chip.warning{background:var(--warning-soft); color:var(--warning);}
  .chip.critical{background:var(--critical-soft); color:var(--critical);}
  .chip.insufficient{background:var(--insufficient-soft); color:var(--insufficient);}

  .toolbar{display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; margin-bottom:12px;}
  .btn{
    background:var(--surface); border:1px solid var(--line-strong); border-radius:var(--radius-sm);
    padding:6px 12px; font-size:12px; font-weight:600; cursor:pointer; color:var(--ink);
  }
  .btn:hover{background:var(--surface-alt);}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
  .btn.primary:hover{background:var(--accent-700); border-color:var(--accent-700);}

  .viz-tooltip{
    position:fixed; pointer-events:none; background:var(--tooltip-bg); color:var(--tooltip-ink);
    padding:8px 11px; border-radius:8px; font-size:11.5px; line-height:1.5; box-shadow:var(--shadow);
    z-index:100; opacity:0; transition:opacity .08s ease; max-width:260px;
  }
  .viz-tooltip b{display:block; margin-bottom:3px; font-size:12px;}
  .viz-tooltip .row{display:flex; justify-content:space-between; gap:14px;}

  .sample-warn{font-size:11.5px; color:var(--critical); font-weight:600; margin-top:8px;}
  .foot-note{font-size:11px; color:var(--ink-faint); margin-top:4px;}
  .stat-tile-row{display:flex; gap:16px; flex-wrap:wrap;}
  .stat-tile{flex:1; min-width:130px;}
  .stat-tile .n{font-family:var(--font-mono); font-size:24px; font-weight:700;}
  .stat-tile .l{font-size:11.5px; color:var(--ink-muted); margin-top:2px;}

  ::-webkit-scrollbar{width:10px; height:10px;}
  ::-webkit-scrollbar-thumb{background:var(--line-strong); border-radius:6px;}
  ::-webkit-scrollbar-track{background:transparent;}

  @media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important;} }

  .auth-gate{
    position:fixed; inset:0; z-index:1000; display:flex; align-items:center; justify-content:center;
    background:var(--ground);
  }
  .auth-card{
    width:100%; max-width:320px; background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius-lg); box-shadow:var(--shadow); padding:28px 26px; text-align:center;
  }
  .auth-brand{font-size:15px; font-weight:800; color:var(--accent); margin-bottom:2px;}
  .auth-title{font-size:18px; font-weight:800; margin-top:10px;}
  .auth-sub{font-size:12px; color:var(--ink-muted); margin-top:4px; margin-bottom:18px;}
  .auth-card input{
    width:100%; box-sizing:border-box; background:var(--surface-alt); border:1px solid var(--line-strong);
    border-radius:var(--radius-sm); padding:10px 12px; font-size:13.5px; color:var(--ink); margin-bottom:10px;
  }
  .auth-card input:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }
  .auth-card .btn{width:100%; padding:10px 0; font-size:13.5px; margin-top:4px;}
  .auth-error{color:var(--critical); font-size:12px; margin-top:10px; min-height:16px;}
</style>

<div class="auth-gate" id="authGate">
  <div class="auth-card">
    <div class="auth-brand">🐾 퓨리나몰 KPI</div>
    <div class="auth-title">접근 인증</div>
    <div class="auth-sub">사내 관계자만 접근 가능합니다. ID/PW를 입력하세요.</div>
    <input id="authId" type="text" placeholder="ID" autocomplete="username">
    <input id="authPw" type="password" placeholder="Password" autocomplete="current-password">
    <div class="btn primary" id="authSubmit">입장</div>
    <div class="auth-error" id="authError"></div>
  </div>
</div>

<div class="app" id="appRoot" style="display:none;">
<script>
(function(){
  var STORAGE_KEY = "purina_kpi_auth_ok_v1";
  var EXPECTED_HASH = "f2fd235f62f00132c66dad00f2659de0d0b61098eac3f6a4607769c1a024a583";
  var gate = document.getElementById("authGate");
  var appRoot = document.getElementById("appRoot");
  function unlock(){ gate.style.display = "none"; appRoot.style.display = ""; }
  try {
    if (localStorage.getItem(STORAGE_KEY) === "1") { unlock(); }
  } catch(e) {}
  async function sha256Hex(str){
    var buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(function(b){ return b.toString(16).padStart(2,"0"); }).join("");
  }
  async function tryLogin(){
    var id = document.getElementById("authId").value.trim();
    var pw = document.getElementById("authPw").value;
    var errEl = document.getElementById("authError");
    if (!id || !pw) { errEl.textContent = "ID와 비밀번호를 모두 입력하세요."; return; }
    var hash = await sha256Hex(id + ":" + pw);
    if (hash === EXPECTED_HASH) {
      try { localStorage.setItem(STORAGE_KEY, "1"); } catch(e) {}
      errEl.textContent = "";
      unlock();
    } else {
      errEl.textContent = "ID 또는 비밀번호가 올바르지 않습니다.";
    }
  }
  document.getElementById("authSubmit").addEventListener("click", tryLogin);
  document.getElementById("authPw").addEventListener("keydown", function(e){ if(e.key === "Enter") tryLogin(); });
  document.getElementById("authId").addEventListener("keydown", function(e){ if(e.key === "Enter") tryLogin(); });
})();
</script>

 화면만 새 데이터로 갱신합니다.\n        [\"executive\",\"funnel\",\"media\",\"cross\",\"quality\"].forEach(function(p){ RENDERERS[p](); });\n      });\n    });\n  }\n}\n\n/* ============================== nav & orchestration ============================== */\nvar RENDERERS = {upload: renderUpload, executive: renderExecutive, funnel: renderFunnel, media: renderMedia, cross: renderCross, brandmedia: renderBrandMedia, sov: renderSov, buzzsov: renderBuzzSov, quality: renderQuality};\nfunction renderAll(){\n  var active = q(\".rail-item.active\").getAttribute(\"data-page\");\n  RENDERERS[active]();\n}\nqa(\".rail-item\").forEach(function(item){\n  item.addEventListener(\"click\", function(){\n    qa(\".rail-item\").forEach(function(i){i.classList.remove(\"active\");});\n    item.classList.add(\"active\");\n    var page = item.getAttribute(\"data-page\");\n    qa(\".page\").forEach(function(p){p.classList.remove(\"active\");});\n    document.getElementById(\"page-\"+page).classList.add(\"active\");\n    document.getElementById(\"pageTitle\").textContent = PAGE_META[page][0];\n    document.getElementById(\"pageDesc\").textContent = PAGE_META[page][1];\n    RENDERERS[page]();\n  });\n});\n\nqa(\"#themeToggle button\").forEach(function(btn){\n  btn.addEventListener(\"click\", function(){\n    qa(\"#themeToggle button\").forEach(function(b){b.classList.remove(\"active\");});\n    btn.classList.add(\"active\");\n    var t = btn.getAttribute(\"data-theme\");\n    if(t===\"system\") document.documentElement.removeAttribute(\"data-theme\");\n    else document.documentElement.setAttribute(\"data-theme\", t);\n  });\n});\n\ndocument.getElementById(\"updatedBadge\").textContent = DATA.lastUpdated ? (\"데이터 최종 갱신일: \" + DATA.lastUpdated) : \"\";\n\nbuildFiltersUI();\nrenderAll();\nwindow.addEventListener(\"resize\", function(){ renderAll(); });\n}catch(__initErr){\n  console.error(\"대시보드 초기화 중 오류:\", __initErr);\n}\n})();\n";

<script>
(function(){

try{

/* ============================== formatting ============================== */
function isNum(v){ return typeof v === "number" && !isNaN(v) && isFinite(v); }
function fmtCurrency(v){ return isNum(v) ? "₩" + Math.round(v).toLocaleString("ko-KR") : "N/A"; }
function fmtPercent(v){ return isNum(v) ? v.toFixed(1) + "%" : "N/A"; }
function fmtCount(v){ return isNum(v) ? Math.round(v).toLocaleString("ko-KR") : "N/A"; }
function fmtCompact(v){
  if(!isNum(v)) return "N/A";
  var a = Math.abs(v);
  if(a >= 1e8) return (v/1e8).toFixed(1) + "억";
  if(a >= 1e4) return (v/1e4).toFixed(0) + "만";
  return Math.round(v).toLocaleString("ko-KR");
}
var KPI_META = {
  spend: ["광고비","currency"], impressions:["노출수","count"], clicks:["클릭수","count"],
  video_views:["시청수","count"], new_members:["신규 방문자수","count"], purchases:["구매건수","count"],
  revenue:["매출액","currency"], roas:["ROAS","percent"], cpm:["CPM","currency"], cpc:["CPC","currency"],
  cpa_new_member:["신규 CPA","currency"], cpa_purchase:["구매 CPA","currency"], ctr:["CTR","percent"],
  cvr_new_member:["신규 CVR","percent"], cvr_purchase:["구매 CVR","percent"], vtr:["VTR","percent"]
};
function fmtKind(kind, v){
  if(kind === "currency") return fmtCurrency(v);
  if(kind === "percent") return fmtPercent(v);
  return fmtCount(v);
}
function fmtKpi(key, v){ var m = KPI_META[key]; return fmtKind(m ? m[1] : "count", v); }
function safeDiv(n, d, mult){
  mult = mult === undefined ? 1 : mult;
  if(!isNum(n) || !isNum(d) || d === 0) return NaN;
  return (n/d)*mult;
}
function computeKpis(row){
  var r = {};
  r.roas = safeDiv(row.revenue, row.spend, 100);
  r.cpm = safeDiv(row.spend, row.impressions, 1000);
  r.cpc = safeDiv(row.spend, row.clicks, 1);
  r.cpa_new_member = safeDiv(row.spend, row.new_members, 1);
  r.cpa_purchase = safeDiv(row.spend, row.purchases, 1);
  r.ctr = safeDiv(row.clicks, row.impressions, 100);
  r.cvr_new_member = safeDiv(row.new_members, row.clicks, 100);
  r.cvr_purchase = safeDiv(row.purchases, row.clicks, 100);
  r.vtr = safeDiv(row.video_views, row.impressions, 100);
  return r;
}
function pctChange(cur, prev){
  if(!isNum(cur) || !isNum(prev) || prev === 0) return null;
  return (cur - prev) / Math.abs(prev) * 100;
}
// 집계 버킷에 필드별로 "실제로 숫자값을 가진 행이 한 번이라도 있었는지" 를 추적해서,
// 전혀 없으면 0이 아니라 NaN(=N/A)으로 남긴다. (그냥 0으로 두면 "측정했더니 0" 과
// "애초에 데이터가 없음" 을 구분할 수 없어 자사몰 데이터가 없는 캠페인의 구매/매출/신규가
// 실제로는 N/A 여야 하는데 0으로 잘못 표시되는 문제가 있었음)
function accumulateFields(bucket, row, fields){
  fields.forEach(function(f){
    if(isNum(row[f])){
      bucket[f] = (bucket[f]||0) + row[f];
      bucket["_has_"+f] = true;
    }
  });
}
function finalizeFields(bucket, fields){
  fields.forEach(function(f){ if(!bucket["_has_"+f]) bucket[f] = NaN; });
  return bucket;
}
function sumField(rows, field){
  var s = 0, any = false;
  for(var i=0;i<rows.length;i++){ var v = rows[i][field]; if(isNum(v)){ s += v; any = true; } }
  return any ? s : NaN;
}
function n2(v){ return v===null||v===undefined||isNaN(v) ? null : v; }

/* ============================== raw data store (mutable - grows on upload) ============================== */
var ALL_FUNNELS = ["AWARENESS","CONSIDERATION","CONVERSION","UNMAPPED"];
var FUNNEL_COLOR = {AWARENESS:"var(--cat-awareness)", CONSIDERATION:"var(--cat-consideration)", CONVERSION:"var(--cat-conversion)", UNMAPPED:"var(--cat-unmapped)"};
var FUNNEL_LABEL = {AWARENESS:"AWARENESS", CONSIDERATION:"CONSIDERATION", CONVERSION:"CONVERSION", UNMAPPED:"UNMAPPED(미분류)"};

var FUNNEL_MAP = (DATA.funnelMapping || []).filter(function(r){ return r.active === true || String(r.active).toUpperCase() === "TRUE"; });
var MEDIA_MAP = (DATA.mediaMapping || []).slice().sort(function(a,b){ return (+a.priority) - (+b.priority); });

var mallRows = (DATA.mallRows || []).slice();
var adRows = (DATA.adRows || []).slice();
var brandMediaRows = (DATA.brandMediaRows || []).slice();
var buzzMentionRows = (DATA.buzzMentionRows || []).slice();
var uploadHistory = (DATA.uploadHistory || []).slice();
var rejectedLog = []; // {upload_id, severity, n} - 이번 세션에서 발생한 오류/경고 요약(누적 저장 안 됨)

function normalizeCode(s){ return String(s==null?"":s).trim().toLowerCase(); }

function classifyFunnel(campaignCode){
  if(campaignCode===null || campaignCode===undefined || String(campaignCode).trim()==="")
    return {stage:"UNMAPPED", matched:null, matchType:"unmapped"};
  var codeNorm = normalizeCode(campaignCode);
  for(var i=0;i<FUNNEL_MAP.length;i++){
    if(FUNNEL_MAP[i].normalized_campaign_code === codeNorm)
      return {stage:FUNNEL_MAP[i].funnel_stage, matched:FUNNEL_MAP[i].source_campaign_code, matchType:"exact"};
  }
  var best = null;
  for(var j=0;j<FUNNEL_MAP.length;j++){
    var p = FUNNEL_MAP[j].normalized_campaign_code;
    if(p && codeNorm.indexOf(p) === 0){
      if(!best || p.length > best.normalized_campaign_code.length) best = FUNNEL_MAP[j];
    }
  }
  if(best) return {stage:best.funnel_stage, matched:best.source_campaign_code, matchType:"prefix"};
  return {stage:"UNMAPPED", matched:null, matchType:"unmapped"};
}

function estimateMedia(campaignCode, referrerDomain){
  var codeNorm = String(campaignCode||"").toLowerCase();
  for(var i=0;i<MEDIA_MAP.length;i++){
    var rule = MEDIA_MAP[i];
    if(rule.rule_type==="campaign_code_contains" && codeNorm.indexOf(String(rule.pattern).toLowerCase())!==-1)
      return {media:rule.media, estimated:true};
  }
  var refNorm = String(referrerDomain||"").toLowerCase();
  if(refNorm){
    for(var j=0;j<MEDIA_MAP.length;j++){
      var rule2 = MEDIA_MAP[j];
      if(rule2.rule_type==="referrer_domain_contains" && refNorm.indexOf(String(rule2.pattern).toLowerCase())!==-1)
        return {media:rule2.media, estimated:true};
    }
  }
  return {media:null, estimated:false};
}

function mallMatchKey(r){ return "mall|"+r.period_start+"|"+r.period_end+"|"+r.campaign_code+"|"+(r.media_product||"")+"|"+r.source_file; }
function adMatchKey(r){ return "ad|"+r.date+"|"+r.campaign_code+"|"+(r.media||""); }

function monthKey(dateStr){ return String(dateStr).slice(0,7)+"-01"; }

function computeCampaignPeriodMart(){
  var mallGroups = {}, adGroups = {};
  mallRows.forEach(function(r){
    var key = r.campaign_code + "\u0001" + monthKey(r.period_start);
    (mallGroups[key] = mallGroups[key] || []).push(r);
  });
  adRows.forEach(function(r){
    var key = r.campaign_code + "\u0001" + monthKey(r.date);
    (adGroups[key] = adGroups[key] || []).push(r);
  });
  var allKeys = {};
  Object.keys(mallGroups).forEach(function(k){allKeys[k]=true;});
  Object.keys(adGroups).forEach(function(k){allKeys[k]=true;});
  var out = [];
  Object.keys(allKeys).forEach(function(key){
    var mg = mallGroups[key] || [], ag = adGroups[key] || [];
    var parts = key.split("\u0001");
    var campaign_code = parts[0], period_month = parts[1];
    var funnel_stage = (mg[0]&&mg[0].funnel_stage) || (ag[0]&&ag[0].funnel_stage) || "UNMAPPED";
    var funnel_mapped = mg[0] ? !!mg[0].funnel_mapped : (ag[0] ? !!ag[0].funnel_mapped : false);
    var mall_clicks = mg.length ? sumField(mg,"clicks") : NaN;
    var ad_clicks = ag.length ? sumField(ag,"clicks") : NaN;
    var clicks = isNum(ad_clicks) ? ad_clicks : mall_clicks;
    var clicks_mismatch_pct = (isNum(ad_clicks)&&isNum(mall_clicks)&&mall_clicks!==0) ? (ad_clicks-mall_clicks)/mall_clicks*100 : null;
    var mediaSet = {};
    ag.forEach(function(r){ if(r.media) mediaSet[r.media]=true; });
    out.push({
      campaign_code: campaign_code, funnel_stage: funnel_stage, funnel_mapped: funnel_mapped, period_month: period_month,
      spend: ag.length?sumField(ag,"spend"):NaN, impressions: ag.length?sumField(ag,"impressions"):NaN,
      clicks: clicks, video_views: ag.length?sumField(ag,"video_views"):NaN,
      new_members: mg.length?sumField(mg,"new_members"):NaN, purchases: mg.length?sumField(mg,"purchases"):NaN,
      revenue: mg.length?sumField(mg,"revenue"):NaN,
      media_list: Object.keys(mediaSet).length ? Object.keys(mediaSet).join(", ") : null,
      mall_clicks: mall_clicks, ad_clicks: ad_clicks, clicks_mismatch_pct: clicks_mismatch_pct
    });
  });
  return out;
}

var RAW, ALL_MONTHS, ALL_MEDIA;
function rebuildMart(){
  RAW = computeCampaignPeriodMart();
  ALL_MONTHS = Array.from(new Set(RAW.map(function(r){return r.period_month;}))).sort();
  if(!ALL_MONTHS.length) ALL_MONTHS = [monthKey(new Date().toISOString())]; // 자사몰/광고성과 데이터가 없어도 필터 UI가 깨지지 않도록 기본값 부여
  ALL_MEDIA = Array.from(new Set(RAW.filter(function(r){return r.media_list;}).map(function(r){return r.media_list.split(", ");}).reduce(function(a,b){return a.concat(b);},[]))).sort();
}
rebuildMart();

/* ============================== CSV upload pipeline (JS 이식판) ============================== */
var MALL_REQUIRED = ["구분코드","클릭수","신규","신규구매","신규매출","회원","회원구매","회원매출"];
var AD_REQUIRED = ["date","campaign_code","spend","impressions","clicks"];
var MALL_NUMERIC_COLS = ["클릭수","신규","신규장바구니","신규구매","신규매출","신규당일매출","회원","회원장바구니","회원구매","회원매출","회원당일매출","신규+회원 구매","신규+회원 매출"];
var AD_NUMERIC_COLS = ["spend","impressions","clicks","video_views"];
var TOTAL_ROW_KEYWORDS = ["합계","소계","total","Total","TOTAL","전체","총계"];

function isTotalRowCode(code){
  var s = String(code==null?"":code).trim();
  if(s==="") return true;
  return TOTAL_ROW_KEYWORDS.some(function(k){return s.indexOf(k)!==-1;});
}
function toNumericSafe(v){
  if(v===undefined||v===null) return {value:NaN, failed:false};
  var s = String(v).replace(/,/g,"").replace(/원/g,"").replace(/%/g,"").replace(/₩/g,"").trim();
  if(s==="") return {value:NaN, failed:false};
  var n = Number(s);
  if(isNaN(n)) return {value:NaN, failed:true};
  return {value:n, failed:false};
}

function parseCSVText(text){
  if(text.charCodeAt(0)===0xFEFF) text = text.slice(1);
  var rows = [], row = [], field = "", inQuotes = false;
  for(var i=0;i<text.length;i++){
    var c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; } else inQuotes = false;
      } else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ',') { row.push(field); field = ""; }
      else if(c === '\r') { /* skip */ }
      else if(c === '\n') { row.push(field); rows.push(row); row = []; field = ""; }
      else field += c;
    }
  }
  row.push(field); rows.push(row);
  while(rows.length && rows[rows.length-1].length===1 && rows[rows.length-1][0]==="") rows.pop();
  var header = (rows[0]||[]).map(function(h){return h.trim();});
  var dataRows = rows.slice(1).map(function(r){
    var obj = {};
    header.forEach(function(h,idx){ obj[h] = r[idx]!==undefined ? r[idx] : ""; });
    return obj;
  });
  return {header:header, rows:dataRows};
}

async function readFileSmart(file){
  var buf = await file.arrayBuffer();
  var bytes = new Uint8Array(buf);
  var hasBom = bytes.length>=3 && bytes[0]===0xEF && bytes[1]===0xBB && bytes[2]===0xBF;
  try{
    var text = new TextDecoder("utf-8", {fatal:true}).decode(buf);
    return {text:text, encoding: hasBom ? "utf-8-sig" : "utf-8"};
  }catch(e){
    try{
      return {text:new TextDecoder("euc-kr").decode(buf), encoding:"euc-kr(cp949)"};
    }catch(e2){
      return {text:new TextDecoder("utf-8").decode(buf), encoding:"utf-8(일부 오류 허용)"};
    }
  }
}

function detectUploadType(header){
  var mallScore = MALL_REQUIRED.filter(function(c){return header.indexOf(c)!==-1;}).length +
    ["신규장바구니","신규당일매출","회원장바구니","회원당일매출","유입경로"].filter(function(c){return header.indexOf(c)!==-1;}).length;
  var adScore = AD_REQUIRED.filter(function(c){return header.indexOf(c)!==-1;}).length +
    ["campaign_name","media","media_product","video_views"].filter(function(c){return header.indexOf(c)!==-1;}).length;
  if(mallScore>=3 && mallScore>=adScore) return "mall_conversion";
  if(adScore>=3) return "ad_performance";
  return "unknown";
}

function validateMallRows(header, rows){
  var missing = MALL_REQUIRED.filter(function(c){return header.indexOf(c)===-1;});
  if(missing.length) return {ok:false, missingColumns:missing};
  if(!rows.length) return {ok:false, empty:true};
  var errors=[], warnings=[], reviews=[], clean=[], seen={};
  rows.forEach(function(r, idx){
    if(isTotalRowCode(r["구분코드"])){ reviews.push({idx:idx, reason:"합계/소계 행으로 판단되어 제외", row:r}); return; }
    var parsed = {}, failAny = false;
    MALL_NUMERIC_COLS.forEach(function(c){
      if(header.indexOf(c)===-1) return;
      var res = toNumericSafe(r[c]); parsed[c]=res.value; if(res.failed) failAny=true;
    });
    if(failAny){ errors.push({idx:idx, reason:"숫자 변환 실패(비수치 값 포함)", row:r}); return; }
    var dupKey = r["구분코드"]+"|"+(r["유입경로"]||"");
    if(seen[dupKey]){ warnings.push({idx:idx, reason:"파일 내 완전 중복 행", row:r}); return; }
    seen[dupKey] = true;
    var negFields = ["클릭수","신규","신규구매","회원","회원구매","신규+회원 구매"];
    if(negFields.some(function(f){return isNum(parsed[f]) && parsed[f]<0;})){
      errors.push({idx:idx, reason:"음수 값", row:r}); return;
    }
    var merged = Object.assign({}, r, parsed);
    if(isNum(merged["클릭수"]) && isNum(merged["신규"]) && merged["신규"]>merged["클릭수"])
      warnings.push({idx:idx, reason:"클릭수보다 신규 방문자 수가 큼", row:r, soft:true});
    clean.push(merged);
  });
  return {ok:true, clean:clean, errors:errors, warnings:warnings, reviews:reviews};
}

function validateAdRows(header, rows){
  var missing = AD_REQUIRED.filter(function(c){return header.indexOf(c)===-1;});
  if(missing.length) return {ok:false, missingColumns:missing};
  if(!rows.length) return {ok:false, empty:true};
  var errors=[], warnings=[], clean=[], seen={};
  rows.forEach(function(r, idx){
    var dateStr = String(r.date||"").trim();
    var dateOk = /^\d{4}-\d{2}-\d{2}/.test(dateStr) && !isNaN(Date.parse(dateStr));
    if(!dateOk){ errors.push({idx:idx, reason:"날짜 형식 오류", row:r}); return; }
    var parsed = {}, failAny = false;
    AD_NUMERIC_COLS.forEach(function(c){
      if(header.indexOf(c)===-1) return;
      var res = toNumericSafe(r[c]); parsed[c]=res.value; if(res.failed) failAny=true;
    });
    if(failAny){ errors.push({idx:idx, reason:"숫자 변환 실패(비수치 값 포함)", row:r}); return; }
    var dupKey = dateStr.slice(0,10)+"|"+r.campaign_code+"|"+(r.media||"");
    if(seen[dupKey]){ warnings.push({idx:idx, reason:"파일 내 완전 중복 행", row:r}); return; }
    seen[dupKey] = true;
    if(["spend","impressions","clicks","video_views"].some(function(f){return isNum(parsed[f]) && parsed[f]<0;})){
      errors.push({idx:idx, reason:"음수 값", row:r}); return;
    }
    var merged = Object.assign({}, r, parsed, {date: dateStr.slice(0,10)});
    if(isNum(merged.impressions) && merged.impressions>0 && isNum(merged.clicks) && merged.clicks>merged.impressions)
      warnings.push({idx:idx, reason:"노출수보다 클릭수가 큼(CTR 100% 초과)", row:r, soft:true});
    clean.push(merged);
  });
  return {ok:true, clean:clean, errors:errors, warnings:warnings, reviews:[]};
}

/* ============================== Media Master xlsx 업로드 파이프라인 (src/media_master.py JS 이식판) ============================== */
var MONTH_MAP_EN = {"Jan":1,"Feb":2,"Mar":3,"Apr":4,"May":5,"Jun":6,"Jul":7,"Aug":8,"Sep":9,"Oct":10,"Nov":11,"Dec":12};
var MEDIA_MASTER_FIELDS = [
  ["spend",5],["impressions",6],["view_count",7],["clicks",8],["ctr",9],["cpc",10],
  ["site_visit",11],["registration",12],["regi_cvr",13],["conversion",14],["cvr",15]
];
var MEDIA_MASTER_INT_FIELDS = {impressions:1, view_count:1, clicks:1, site_visit:1, registration:1, conversion:1};

function parseMediaMasterPeriod(dateCell){
  if(dateCell===null || dateCell===undefined) return null;
  var parts = String(dateCell).trim().split(/\s+/);
  if(parts.length !== 2) return null;
  var y = parts[0], mon = parts[1];
  mon = mon.charAt(0).toUpperCase() + mon.slice(1).toLowerCase(); // '2026 jun' 같은 대소문자 오타 방어
  if(!MONTH_MAP_EN[mon] || !/^\d+$/.test(y)) return null;
  return y.padStart(4,"0") + "-" + String(MONTH_MAP_EN[mon]).padStart(2,"0") + "-01";
}
function mediaMasterCleanNum(v){
  if(v===null || v===undefined) return null;
  if(typeof v === "string"){
    var s = v.trim().replace(/,/g,"");
    if(s==="" || s==="-") return null;
    var n = Number(s);
    return isNaN(n) ? null : n;
  }
  return v;
}
function brandMediaMatchKey(r){ return "bm|"+r.period_month+"|"+r.brand+"|"+r.funnel_stage+"|"+r.media+"|"+r.source_file; }

/* ============================== 썸트렌드(Buzz) xlsx 업로드 파이프라인 (src/sometrend.py JS 이식판) ============================== */
function parseSometrendDate(v){
  // '2025.09.10'(일자) 또는 '2026.01.01~2026.01.31'(카테고리 전체 언급량, 월 범위) 모두 처리.
  if(v===null || v===undefined) return null;
  var s = String(v).trim();
  if(s.indexOf("~")!==-1) s = s.split("~")[0].trim();
  if(s.indexOf(".")!==-1 && s.replace(/\./g,"").length===8){
    var parts = s.split(".");
    if(parts.length===3) return parts[0]+"-"+parts[1]+"-"+parts[2];
  }
  return null;
}
function findSometrendMeta(rows2D, label){
  for(var i=0;i<Math.min(rows2D.length,12);i++){
    var row = rows2D[i] || [];
    if(row[0] && String(row[0]).trim().replace(/^●/,"").trim() === label){
      return (row[1]!==undefined && row[1]!==null) ? String(row[1]).trim() : null;
    }
  }
  return null;
}
// rows2D: XLSX.utils.sheet_to_json(sheet, {header:1, raw:true}) 결과 ("언급량" 시트 그대로).
function parseSometrendMentions(rows2D, sourceFile, uploadedAt){
  var brand = findSometrendMeta(rows2D, "주제어");
  if(!brand) return {brand:null, records:[]};
  var headerIdx = -1;
  for(var i=0;i<rows2D.length;i++){
    if(rows2D[i] && rows2D[i][0]==="날짜"){ headerIdx = i; break; }
  }
  if(headerIdx===-1) return {brand:brand, records:[]};
  var records = [];
  for(var j=headerIdx+1; j<rows2D.length; j++){
    var row = rows2D[j] || [];
    var d = parseSometrendDate(row[0]);
    if(!d) continue;
    var rec = {
      date:d, brand:brand, source_file:sourceFile, uploaded_at:uploadedAt,
      total: mediaMasterCleanNum(row[1]), community: mediaMasterCleanNum(row[2]),
      instagram: mediaMasterCleanNum(row[3]), blog: mediaMasterCleanNum(row[4]), news: mediaMasterCleanNum(row[5])
    };
    rec.match_key = buzzMentionMatchKey(rec);
    records.push(rec);
  }
  return {brand:brand, records:records};
}
function buzzMentionMatchKey(r){ return "buzz|"+r.date+"|"+r.brand+"|"+r.source_file; }

// rows2D: XLSX.utils.sheet_to_json(sheet, {header:1, raw:true}) 결과 (0-based, "Media" 시트 그대로).
// Python 쪽 min_row=5(1-based) == 이 배열의 인덱스 4 부터가 데이터 행.
function parseMediaMasterRows(rows2D, sourceFile, uploadedAt){
  var lastDate = null, lastCampaign = null, lastFunnel = null;
  var records = [];
  for(var i=4; i<rows2D.length; i++){
    var row = rows2D[i] || [];
    var dateC = row[0], campC = row[1], funnelC = row[2], mediaC = row[4];
    if(dateC!==null && dateC!==undefined && dateC!=="") lastDate = dateC;
    if(campC!==null && campC!==undefined && campC!=="") lastCampaign = campC;
    if(funnelC!==null && funnelC!==undefined && funnelC!=="") lastFunnel = funnelC;
    if(mediaC===null || mediaC===undefined || mediaC==="") continue; // 소계/합계 행
    if(lastFunnel === "Total") continue;
    if(lastCampaign && String(lastCampaign).indexOf("Total")!==-1) continue;
    var periodMonth = parseMediaMasterPeriod(lastDate);
    var rec = {
      period_month: periodMonth, brand: lastCampaign ? String(lastCampaign).trim() : null,
      funnel_stage: lastFunnel ? String(lastFunnel).trim() : null, media: String(mediaC).trim(),
      source_file: sourceFile, uploaded_at: uploadedAt
    };
    MEDIA_MASTER_FIELDS.forEach(function(pair){
      var val = mediaMasterCleanNum(row[pair[1]]);
      if(MEDIA_MASTER_INT_FIELDS[pair[0]] && val!==null) val = Math.round(val);
      rec[pair[0]] = val;
    });
    rec.match_key = brandMediaMatchKey(rec);
    records.push(rec);
  }
  return records.filter(function(r){ return r.period_month && r.brand && r.funnel_stage; });
}

function mergeDedup(existingRows, newRows){
  var existingKeys = {};
  existingRows.forEach(function(r){ existingKeys[r.match_key] = true; });
  var added = [], dup = 0;
  newRows.forEach(function(r){
    if(existingKeys[r.match_key]){ dup++; return; }
    existingKeys[r.match_key] = true; added.push(r);
  });
  return {merged: existingRows.concat(added), addedCount: added.length, dupCount: dup};
}

function escapeForScript(s){ return s.replace(/<\/script/gi, "<\\/script").replace(/<!--/g, "<\\!--"); }

  if(!window.claude || typeof window.claude.use !== "function")

    else if(code==="conflict") msg = "다른 사람이 방금 업데이트했습니다. 곧 최신 버전으로 새로고침됩니다.";

    else if(code==="rate_limited") msg = "너무 자주 게시했습니다. 잠시 후 다시 시도해주세요.";

/* ============================== filter state ============================== */
var state = {
  // 기본값을 전체 기간이 아니라 최신 월 하나로 좁혀서, "직전 동일 기간" 등 비교 데이터가
  // 항상 존재하는 범위(같은 데이터셋 안의 바로 이전 월)에서 계산되도록 함.
  start: ALL_MONTHS[ALL_MONTHS.length-1], end: ALL_MONTHS[ALL_MONTHS.length-1],
  funnels: ALL_FUNNELS.slice(), media: [], campaignQuery: "", minSpend: 0,
  compare: "직전 동일 기간",
  sovRangeMonths: 13, sovMetric: "spend",
  brandMediaFilter: "__ALL__",
  buzzCategory: null, buzzChannelBrand: null
};

function monthAdd(ym, delta){
  var parts = ym.split("-"); var y = +parts[0], m = +parts[1] - 1;
  var d = new Date(Date.UTC(y, m + delta, 1));
  return d.getUTCFullYear() + "-" + String(d.getUTCMonth()+1).padStart(2,"0") + "-01";
}
function monthSpan(a,b){
  var pa=a.split("-"), pb=b.split("-");
  return (+pb[0]-+pa[0])*12 + (+pb[1]-+pa[1]) + 1;
}
function getPrevRange(){
  var span = monthSpan(state.start, state.end);
  if(state.compare === "전년 동기"){
    var ps = monthAdd(state.start,-12), pe = monthAdd(state.end,-12);
    if(ps < ALL_MONTHS[0]) return null;
    return [ps, pe];
  }
  // 직전 동일 기간 / 전월 / 전주 -> 월 단위 데이터에서는 모두 "직전 span개월"로 처리
  var ps2 = monthAdd(state.start, -span), pe2 = monthAdd(state.end, -span);
  if(ps2 < ALL_MONTHS[0]) return null;
  return [ps2, pe2];
}
function inRange(row, s, e){ return row.period_month >= s && row.period_month <= e; }
function applyFilters(rows, rangeOverride){
  var s = rangeOverride ? rangeOverride[0] : state.start;
  var e = rangeOverride ? rangeOverride[1] : state.end;
  return rows.filter(function(r){
    if(!inRange(r, s, e)) return false;
    if(state.funnels.indexOf(r.funnel_stage) === -1) return false;
    if(state.media.length){
      if(!r.media_list) return false;
      var ml = r.media_list.split(", ");
      if(!state.media.some(function(m){return ml.indexOf(m) !== -1;})) return false;
    }
    if(state.campaignQuery && r.campaign_code.toLowerCase().indexOf(state.campaignQuery.toLowerCase()) === -1) return false;
    if(state.minSpend && !(isNum(r.spend) && r.spend >= state.minSpend)) return false;
    return true;
  });
}

/* ============================== DOM helpers ============================== */
function el(tag, cls, html){ var e = document.createElement(tag); if(cls) e.className = cls; if(html !== undefined) e.innerHTML = html; return e; }
function q(sel, root){ return (root||document).querySelector(sel); }
function qa(sel, root){ return Array.prototype.slice.call((root||document).querySelectorAll(sel)); }

var tooltipEl = document.getElementById("vizTooltip");
function showTooltip(x, y, html){
  tooltipEl.innerHTML = html;
  tooltipEl.style.opacity = "1";
  var pad = 14;
  var vw = window.innerWidth, vh = window.innerHeight;
  var rect = tooltipEl.getBoundingClientRect();
  var left = x + pad, top = y + pad;
  if(left + rect.width > vw - 8) left = x - rect.width - pad;
  if(top + rect.height > vh - 8) top = y - rect.height - pad;
  tooltipEl.style.left = left + "px";
  tooltipEl.style.top = top + "px";
}
function hideTooltip(){ tooltipEl.style.opacity = "0"; }

function svgEl(tag, attrs){
  var e = document.createElementNS(NS, tag);
  for(var k in attrs) e.setAttribute(k, attrs[k]);

}

/* ============================== chart: dual line trend ============================== */
function lineChart(container, months, seriesA, seriesB, labelA, labelB, colorA, colorB, fmtA, fmtB){
  container.innerHTML = "";
  var W = container.clientWidth || 480, H = 220, padL = 54, padR = 14, padT = 14, padB = 26;
  var svg = svgEl("svg", {viewBox: "0 0 " + W + " " + H, width:"100%", height:H, style:"display:block; overflow:visible;"});
  var vals = seriesA.concat(seriesB).filter(isNum);
  var maxV = vals.length ? Math.max.apply(null, vals) : 1;
  maxV = maxV <= 0 ? 1 : maxV * 1.15;
  var n = months.length;
  function xPos(i){ return padL + (n<=1 ? 0 : i * (W-padL-padR)/(n-1)); }
  function yPos(v){ return padT + (H-padT-padB) * (1 - (isNum(v)?v:0)/maxV); }

  // grid
  var gridN = 4;
  for(var g=0; g<=gridN; g++){
    var gy = padT + (H-padT-padB)*g/gridN;
    svg.appendChild(svgEl("line", {x1:padL, x2:W-padR, y1:gy, y2:gy, stroke:"var(--line)", "stroke-width":1}));
    var gv = maxV * (1 - g/gridN);
    var t = svgEl("text", {x:padL-8, y:gy+4, "text-anchor":"end", "font-size":10, fill:"var(--ink-faint)"});
    t.textContent = fmtCompact(gv);
    svg.appendChild(t);
  }
  months.forEach(function(m,i){
    var t = svgEl("text", {x:xPos(i), y:H-8, "text-anchor":"middle", "font-size":10, fill:"var(--ink-faint)"});
    t.textContent = m.slice(0,7);
    svg.appendChild(t);
  });

  function drawSeries(series, color){
    var pts = series.map(function(v,i){ return isNum(v) ? [xPos(i), yPos(v)] : null; }).filter(Boolean);
    if(pts.length === 0) return;
    var d = pts.map(function(p,i){ return (i===0?"M":"L") + p[0].toFixed(1) + "," + p[1].toFixed(1); }).join(" ");
    svg.appendChild(svgEl("path", {d:d, fill:"none", stroke:color, "stroke-width":2.4, "stroke-linecap":"round", "stroke-linejoin":"round"}));
    pts.forEach(function(p){
      svg.appendChild(svgEl("circle", {cx:p[0], cy:p[1], r:3.6, fill:color, stroke:"var(--surface)", "stroke-width":1.6}));
    });
  }
  drawSeries(seriesA, colorA);
  drawSeries(seriesB, colorB);

  // hover crosshair
  var hoverLine = svgEl("line", {y1:padT, y2:H-padB, stroke:"var(--ink-faint)", "stroke-width":1, "stroke-dasharray":"3,3", opacity:0});
  svg.appendChild(hoverLine);
  var hitArea = svgEl("rect", {x:padL, y:padT, width:Math.max(1,W-padL-padR), height:H-padT-padB, fill:"transparent"});
  svg.addEventListener("mousemove", function(evt){
    var rect = svg.getBoundingClientRect();
    var mx = (evt.clientX - rect.left) * (W/rect.width);
    var idx = Math.round((mx-padL) / ((W-padL-padR)/(Math.max(1,n-1))));
    idx = Math.max(0, Math.min(n-1, idx));
    hoverLine.setAttribute("x1", xPos(idx)); hoverLine.setAttribute("x2", xPos(idx)); hoverLine.setAttribute("opacity", 1);
    var html = "<b>" + months[idx].slice(0,7) + "</b>" +
      "<div class='row'><span>" + labelA + "</span><span>" + fmtA(seriesA[idx]) + "</span></div>" +
      "<div class='row'><span>" + labelB + "</span><span>" + fmtB(seriesB[idx]) + "</span></div>";
    showTooltip(evt.clientX, evt.clientY, html);
  });
  svg.addEventListener("mouseleave", function(){ hoverLine.setAttribute("opacity",0); hideTooltip(); });
  svg.appendChild(hitArea);
  container.appendChild(svg);
}

/* ============================== chart: donut ============================== */
function donutChart(container, entries){
  // entries: [{label,value,color}]
  container.innerHTML = "";
  var total = entries.reduce(function(s,e){return s+e.value;},0);
  var W = 180, H = 180, cx = W/2, cy = H/2, rOuter = 78, rInner = 48;
  var svg = svgEl("svg", {viewBox:"0 0 " + W + " " + H, width:W, height:H});
  var wrap = el("div", "", "");
  wrap.style.cssText = "display:flex; gap:18px; align-items:center; flex-wrap:wrap;";
  var angle = -Math.PI/2;
  entries.forEach(function(e){
    var frac = total>0 ? e.value/total : 0;
    var a0 = angle, a1 = angle + frac*Math.PI*2;
    angle = a1;
    function pt(r,a){ return [cx + r*Math.cos(a), cy + r*Math.sin(a)]; }
    var p0o = pt(rOuter,a0), p1o = pt(rOuter,a1), p0i = pt(rInner,a1), p1i = pt(rInner,a0);
    var large = (a1-a0) > Math.PI ? 1 : 0;
    var d = "M" + p0o[0]+","+p0o[1] + " A"+rOuter+","+rOuter+" 0 "+large+" 1 "+p1o[0]+","+p1o[1] +
            " L" + p0i[0]+","+p0i[1] + " A"+rInner+","+rInner+" 0 "+large+" 0 "+p1i[0]+","+p1i[1] + " Z";
    var path = svgEl("path", {d:d, fill:e.color, stroke:"var(--surface)", "stroke-width":2});
    path.addEventListener("mousemove", function(evt){
      showTooltip(evt.clientX, evt.clientY, "<b>"+e.label+"</b><div class='row'><span>비중</span><span>"+(total>0?(e.value/total*100).toFixed(1):"0.0")+"%</span></div><div class='row'><span>금액</span><span>"+fmtCurrency(e.value)+"</span></div>");
      path.style.opacity = 0.85;
    });
    path.addEventListener("mouseleave", function(){ hideTooltip(); path.style.opacity = 1; });
    svg.appendChild(path);
  });
  var centerText = svgEl("text", {x:cx, y:cy-3, "text-anchor":"middle", "font-size":11, fill:"var(--ink-faint)"});
  centerText.textContent = "합계";
  svg.appendChild(centerText);
  var centerVal = svgEl("text", {x:cx, y:cy+13, "text-anchor":"middle", "font-size":13, fill:"var(--ink)", "font-weight":700});
  centerVal.textContent = fmtCompact(total);
  svg.appendChild(centerVal);
  wrap.appendChild(svg);

  var legend = el("div", "legend", "");
  legend.style.cssText = "flex-direction:column; gap:8px; margin:0;";
  entries.forEach(function(e){
    var item = el("div", "legend-item");
    var pct = total>0 ? (e.value/total*100).toFixed(1) : "0.0";
    item.innerHTML = "<span class='legend-dot' style='background:"+e.color+"'></span><span>"+e.label+" — "+pct+"%</span>";
    legend.appendChild(item);
  });
  wrap.appendChild(legend);
  container.appendChild(wrap);
}

/* ============================== chart: horizontal bar ============================== */
function hBarChart(container, entries, fmt, colorFn){
  // entries: [{label, value}]
  container.innerHTML = "";
  entries = entries.filter(function(e){return isNum(e.value);}).sort(function(a,b){return b.value-a.value;});
  if(!entries.length){ container.innerHTML = "<div class='foot-note'>표시할 데이터가 없습니다.</div>"; return; }
  var maxV = Math.max.apply(null, entries.map(function(e){return Math.abs(e.value);})) || 1;
  var rowH = 26, gap=8, padL = 4, labelW = 118;
  var W = container.clientWidth || 480;
  var barAreaW = W - labelW - 70;
  var H = entries.length * (rowH+gap);
  var svg = svgEl("svg", {viewBox:"0 0 "+W+" "+H, width:"100%", height:H});
  entries.forEach(function(e,i){
    var y = i*(rowH+gap);
    var lbl = svgEl("text", {x:labelW-8, y:y+rowH/2+4, "text-anchor":"end", "font-size":11.5, fill:"var(--ink)"});
    lbl.textContent = e.label.length > 14 ? e.label.slice(0,13)+"…" : e.label;
    svg.appendChild(lbl);
    var w = Math.max(2, Math.abs(e.value)/maxV * barAreaW);
    var rect = svgEl("rect", {x:labelW, y:y+3, width:w, height:rowH-6, rx:5, fill: colorFn ? colorFn(e) : "var(--accent)"});
    svg.appendChild(rect);
    var val = svgEl("text", {x:labelW + w + 8, y:y+rowH/2+4, "font-size":11.5, fill:"var(--ink-muted)", "font-family":"var(--font-mono)"});
    val.textContent = fmt(e.value);
    svg.appendChild(val);
    var hit = svgEl("rect", {x:0, y:y, width:W, height:rowH+gap, fill:"transparent"});
    hit.addEventListener("mousemove", function(evt){
      showTooltip(evt.clientX, evt.clientY, "<b>"+e.label+"</b><div class='row'><span>값</span><span>"+fmt(e.value)+"</span></div>");
      rect.style.opacity = 0.8;
    });
    hit.addEventListener("mouseleave", function(){ hideTooltip(); rect.style.opacity = 1; });
    svg.appendChild(hit);
  });
  container.appendChild(svg);
}

/* ============================== chart: scatter ============================== */
function scatterChart(container, points, xLabel, yLabel, fmtX, fmtY){
  container.innerHTML = "";
  var valid = points.filter(function(p){ return isNum(p.x) && isNum(p.y); });
  var W = container.clientWidth || 560, H = 320, padL=58, padR=16, padT=14, padB=34;
  if(!valid.length){ container.innerHTML = "<div class='foot-note'>표시할 데이터가 없습니다 (선택한 두 지표 모두 값이 있는 캠페인이 없음).</div>"; return; }
  var xs = valid.map(function(p){return p.x;}), ys = valid.map(function(p){return p.y;});
  var xMin = Math.min(0, Math.min.apply(null,xs)), xMax = Math.max.apply(null,xs)*1.08 || 1;
  var yMin = Math.min(0, Math.min.apply(null,ys)), yMax = Math.max.apply(null,ys)*1.12 || 1;
  var spends = valid.map(function(p){return isNum(p.size)?p.size:0;});
  var maxSpend = Math.max.apply(null, spends) || 1;
  function xPos(v){ return padL + (v-xMin)/(xMax-xMin||1) * (W-padL-padR); }
  function yPos(v){ return padT + (1 - (v-yMin)/(yMax-yMin||1)) * (H-padT-padB); }
  var svg = svgEl("svg", {viewBox:"0 0 "+W+" "+H, width:"100%", height:H});
  for(var g=0; g<=4; g++){
    var gy = padT + (H-padT-padB)*g/4;
    svg.appendChild(svgEl("line",{x1:padL,x2:W-padR,y1:gy,y2:gy,stroke:"var(--line)","stroke-width":1}));
    var gv = yMax - (yMax-yMin)*g/4;
    var t = svgEl("text",{x:padL-8,y:gy+4,"text-anchor":"end","font-size":10,fill:"var(--ink-faint)"});
    t.textContent = fmtCompact(gv); svg.appendChild(t);
  }
  for(var gx=0; gx<=4; gx++){
    var gxp = padL + (W-padL-padR)*gx/4;
    var gvx = xMin + (xMax-xMin)*gx/4;
    var tx = svgEl("text",{x:gxp,y:H-14,"text-anchor":"middle","font-size":10,fill:"var(--ink-faint)"});
    tx.textContent = fmtCompact(gvx); svg.appendChild(tx);
  }
  var xAxisLbl = svgEl("text",{x:(padL+W-padR)/2,y:H-2,"text-anchor":"middle","font-size":10.5,fill:"var(--ink-muted)","font-weight":600});
  xAxisLbl.textContent = xLabel; svg.appendChild(xAxisLbl);

  valid.forEach(function(p){
    var r = 4 + Math.sqrt((p.size||0)/maxSpend) * 12;
    var c = svgEl("circle", {cx:xPos(p.x), cy:yPos(p.y), r:r, fill: FUNNEL_COLOR[p.funnel] ? "var(--cat-"+p.funnel.toLowerCase()+")" : "var(--cat-unmapped)", "fill-opacity":0.72, stroke:"var(--surface)", "stroke-width":1.2});
    c.addEventListener("mousemove", function(evt){
      showTooltip(evt.clientX, evt.clientY,
        "<b>"+p.campaign+"</b>"+
        "<div class='row'><span>매체</span><span>"+(p.media||"—")+"</span></div>"+
        "<div class='row'><span>퍼널</span><span>"+p.funnel+"</span></div>"+
        "<div class='row'><span>광고비</span><span>"+fmtCurrency(p.size)+"</span></div>"+
        "<div class='row'><span>"+xLabel+"</span><span>"+fmtX(p.x)+"</span></div>"+
        "<div class='row'><span>"+yLabel+"</span><span>"+fmtY(p.y)+"</span></div>");
      c.setAttribute("fill-opacity", 1);
    });
    c.addEventListener("mouseleave", function(){ hideTooltip(); c.setAttribute("fill-opacity", 0.72); });
    svg.appendChild(c);
  });
  container.appendChild(svg);

  var legend = el("div","legend");
  ALL_FUNNELS.forEach(function(f){
    var item = el("div","legend-item");
    item.innerHTML = "<span class='legend-dot' style='background:var(--cat-"+f.toLowerCase()+")'></span><span>"+FUNNEL_LABEL[f]+"</span>";
    legend.appendChild(item);
  });
  container.appendChild(legend);
}

/* ============================== chart: multi-series line (N개 시리즈, 동일 축) ============================== */
function multiLineChart(container, months, series, fmt, labelEvery){
  // series: [{label, color, values}]  values.length === months.length
  container.innerHTML = "";
  var W = container.clientWidth || 480, H = 260, padL = 54, padR = 14, padT = 14, padB = 26;
  var svg = svgEl("svg", {viewBox: "0 0 " + W + " " + H, width:"100%", height:H, style:"display:block; overflow:visible;"});
  var allVals = series.reduce(function(acc,s){return acc.concat(s.values);},[]).filter(isNum);
  var maxV = allVals.length ? Math.max.apply(null, allVals) : 1;
  maxV = maxV <= 0 ? 1 : maxV * 1.15;
  var n = months.length;
  labelEvery = labelEvery || Math.max(1, Math.ceil(n/10));
  function xPos(i){ return padL + (n<=1 ? 0 : i * (W-padL-padR)/(n-1)); }
  function yPos(v){ return padT + (H-padT-padB) * (1 - (isNum(v)?v:0)/maxV); }

  var gridN = 4;
  for(var g=0; g<=gridN; g++){
    var gy = padT + (H-padT-padB)*g/gridN;
    svg.appendChild(svgEl("line", {x1:padL, x2:W-padR, y1:gy, y2:gy, stroke:"var(--line)", "stroke-width":1}));
    var gv = maxV * (1 - g/gridN);
    var t = svgEl("text", {x:padL-8, y:gy+4, "text-anchor":"end", "font-size":10, fill:"var(--ink-faint)"});
    t.textContent = fmt(gv);
    svg.appendChild(t);
  }
  months.forEach(function(m,i){
    if(i % labelEvery !== 0 && i !== n-1) return;
    var t = svgEl("text", {x:xPos(i), y:H-8, "text-anchor":"middle", "font-size":10, fill:"var(--ink-faint)"});
    t.textContent = m.slice(0,7);
    svg.appendChild(t);
  });

  series.forEach(function(s){
    var pts = s.values.map(function(v,i){ return isNum(v) ? [xPos(i), yPos(v)] : null; }).filter(Boolean);
    if(pts.length === 0) return;
    var d = pts.map(function(p,i){ return (i===0?"M":"L") + p[0].toFixed(1) + "," + p[1].toFixed(1); }).join(" ");
    svg.appendChild(svgEl("path", {d:d, fill:"none", stroke:s.color, "stroke-width":2.2, "stroke-linecap":"round", "stroke-linejoin":"round"}));
  });

  var hoverLine = svgEl("line", {y1:padT, y2:H-padB, stroke:"var(--ink-faint)", "stroke-width":1, "stroke-dasharray":"3,3", opacity:0});
  svg.appendChild(hoverLine);
  var hitArea = svgEl("rect", {x:padL, y:padT, width:Math.max(1,W-padL-padR), height:H-padT-padB, fill:"transparent"});
  svg.addEventListener("mousemove", function(evt){
    var rect = svg.getBoundingClientRect();
    var mx = (evt.clientX - rect.left) * (W/rect.width);
    var idx = Math.round((mx-padL) / ((W-padL-padR)/(Math.max(1,n-1))));
    idx = Math.max(0, Math.min(n-1, idx));
    hoverLine.setAttribute("x1", xPos(idx)); hoverLine.setAttribute("x2", xPos(idx)); hoverLine.setAttribute("opacity", 1);
    var html = "<b>" + months[idx].slice(0,7) + "</b>" +
      series.map(function(s){ return "<div class='row'><span>"+s.label+"</span><span>"+fmt(s.values[idx])+"</span></div>"; }).join("");
    showTooltip(evt.clientX, evt.clientY, html);
  });
  svg.addEventListener("mouseleave", function(){ hoverLine.setAttribute("opacity",0); hideTooltip(); });
  svg.appendChild(hitArea);
  container.appendChild(svg);
}

/* ============================== chart: dual-axis line (좌/우 축 다른 지표 비교) ============================== */
// rightSeries: [{label, color, values}] - 우축을 공유하는 1개 이상의 시리즈 (예: 신규 방문자수 + 구매건수처럼
// 서로 스케일이 비슷한 지표를 같은 축에 겹쳐 그릴 때 사용. 좌축은 항상 1개 시리즈(예: 광고비, 스케일이 크게 다름).
function dualAxisLineChart(container, months, leftValues, rightSeries, leftLabel, leftColor, fmtLeft, fmtRight){
  container.innerHTML = "";
  var W = container.clientWidth || 480, H = 260, padL = 54, padR = 54, padT = 14, padB = 26;
  var svg = svgEl("svg", {viewBox: "0 0 " + W + " " + H, width:"100%", height:H, style:"display:block; overflow:visible;"});
  var lv = leftValues.filter(isNum);
  var rv = rightSeries.reduce(function(acc,s){return acc.concat(s.values);},[]).filter(isNum);
  var maxL = lv.length ? Math.max.apply(null, lv) : 1; maxL = maxL<=0 ? 1 : maxL*1.15;
  var maxR = rv.length ? Math.max.apply(null, rv) : 1; maxR = maxR<=0 ? 1 : maxR*1.15;
  var n = months.length;
  var rightColor = rightSeries[0] ? rightSeries[0].color : "var(--accent)";
  function xPos(i){ return padL + (n<=1 ? 0 : i * (W-padL-padR)/(n-1)); }
  function yPosL(v){ return padT + (H-padT-padB) * (1 - (isNum(v)?v:0)/maxL); }
  function yPosR(v){ return padT + (H-padT-padB) * (1 - (isNum(v)?v:0)/maxR); }

  var gridN = 4;
  for(var g=0; g<=gridN; g++){
    var gy = padT + (H-padT-padB)*g/gridN;
    svg.appendChild(svgEl("line", {x1:padL, x2:W-padR, y1:gy, y2:gy, stroke:"var(--line)", "stroke-width":1}));
    var tl = svgEl("text", {x:padL-8, y:gy+4, "text-anchor":"end", "font-size":10, fill:leftColor});
    tl.textContent = fmtLeft(maxL*(1-g/gridN)); svg.appendChild(tl);
    var tr = svgEl("text", {x:W-padR+8, y:gy+4, "text-anchor":"start", "font-size":10, fill:rightColor});
    tr.textContent = fmtRight(maxR*(1-g/gridN)); svg.appendChild(tr);
  }
  months.forEach(function(m,i){
    var t = svgEl("text", {x:xPos(i), y:H-8, "text-anchor":"middle", "font-size":10, fill:"var(--ink-faint)"});
    t.textContent = m.slice(0,7);
    svg.appendChild(t);
  });

  function drawSeries(values, color, yFn){
    var pts = values.map(function(v,i){ return isNum(v) ? [xPos(i), yFn(v)] : null; }).filter(Boolean);
    if(pts.length === 0) return;
    var d = pts.map(function(p,i){ return (i===0?"M":"L") + p[0].toFixed(1) + "," + p[1].toFixed(1); }).join(" ");
    svg.appendChild(svgEl("path", {d:d, fill:"none", stroke:color, "stroke-width":2.4, "stroke-linecap":"round", "stroke-linejoin":"round"}));
    pts.forEach(function(p){ svg.appendChild(svgEl("circle", {cx:p[0], cy:p[1], r:3.6, fill:color, stroke:"var(--surface)", "stroke-width":1.6})); });
  }
  drawSeries(leftValues, leftColor, yPosL);
  rightSeries.forEach(function(s){ drawSeries(s.values, s.color, yPosR); });

  var hoverLine = svgEl("line", {y1:padT, y2:H-padB, stroke:"var(--ink-faint)", "stroke-width":1, "stroke-dasharray":"3,3", opacity:0});
  svg.appendChild(hoverLine);
  var hitArea = svgEl("rect", {x:padL, y:padT, width:Math.max(1,W-padL-padR), height:H-padT-padB, fill:"transparent"});
  svg.addEventListener("mousemove", function(evt){
    var rect = svg.getBoundingClientRect();
    var mx = (evt.clientX - rect.left) * (W/rect.width);
    var idx = Math.round((mx-padL) / ((W-padL-padR)/(Math.max(1,n-1))));
    idx = Math.max(0, Math.min(n-1, idx));
    hoverLine.setAttribute("x1", xPos(idx)); hoverLine.setAttribute("x2", xPos(idx)); hoverLine.setAttribute("opacity", 1);
    var html = "<b>" + months[idx].slice(0,7) + "</b>" +
      "<div class='row'><span>" + leftLabel + "</span><span>" + fmtLeft(leftValues[idx]) + "</span></div>" +
      rightSeries.map(function(s){ return "<div class='row'><span>" + s.label + "</span><span>" + fmtRight(s.values[idx]) + "</span></div>"; }).join("");
    showTooltip(evt.clientX, evt.clientY, html);
  });
  svg.addEventListener("mouseleave", function(){ hoverLine.setAttribute("opacity",0); hideTooltip(); });
  svg.appendChild(hitArea);
  container.appendChild(svg);
}

/* ============================== filter bar UI ============================== */
function buildFiltersUI(){
  var row = document.getElementById("filtersRow");
  row.innerHTML = "";

  function field(labelText, node){
    var f = el("div","ffield");
    var l = el("label","",labelText);
    var c = el("div","ctl");
    c.appendChild(node);
    f.appendChild(l); f.appendChild(c);
    row.appendChild(f);
    return f;
  }

  var startInput = el("input"); startInput.type="month"; startInput.value = state.start.slice(0,7);
  startInput.min = ALL_MONTHS[0].slice(0,7); startInput.max = ALL_MONTHS[ALL_MONTHS.length-1].slice(0,7);
  var endInput = el("input"); endInput.type="month"; endInput.value = state.end.slice(0,7);
  endInput.min = ALL_MONTHS[0].slice(0,7); endInput.max = ALL_MONTHS[ALL_MONTHS.length-1].slice(0,7);
  startInput.addEventListener("change", function(){ state.start = startInput.value + "-01"; renderAll(); });
  endInput.addEventListener("change", function(){ state.end = endInput.value + "-01"; renderAll(); });
  var f1 = field("기간 (월 단위)", startInput);
  f1.querySelector(".ctl").appendChild(el("span","","–"));
  f1.querySelector(".ctl").appendChild(endInput);

  function multiSelect(labelText, options, selectedArr, onChange){
    var wrap = el("div","msel");
    var btn = el("div","msel-btn");
    function refreshBtn(){
      btn.innerHTML = (selectedArr.length ? "선택 " : "전체") + (selectedArr.length ? "<span class='count'>"+selectedArr.length+"</span>" : "");
    }
    refreshBtn();
    var pop = el("div","msel-pop");
    options.forEach(function(opt){
      var o = el("label","msel-opt");
      var cb = el("input"); cb.type="checkbox"; cb.checked = selectedArr.indexOf(opt)!==-1;
      cb.addEventListener("change", function(){
        var idx = selectedArr.indexOf(opt);
        if(cb.checked && idx===-1) selectedArr.push(opt);
        if(!cb.checked && idx!==-1) selectedArr.splice(idx,1);
        refreshBtn(); onChange();
      });
      o.appendChild(cb); o.appendChild(document.createTextNode(FUNNEL_LABEL[opt]||opt));
      pop.appendChild(o);
    });
    btn.addEventListener("click", function(e){ e.stopPropagation(); qa(".msel.open").forEach(function(m){ if(m!==wrap) m.classList.remove("open");}); wrap.classList.toggle("open"); });
    wrap.appendChild(btn); wrap.appendChild(pop);
    document.addEventListener("click", function(){ wrap.classList.remove("open"); });
    pop.addEventListener("click", function(e){ e.stopPropagation(); });
    return wrap;
  }
  field("퍼널 단계", multiSelect("퍼널", ALL_FUNNELS, state.funnels, renderAll));
  field("매체", multiSelect("매체", ALL_MEDIA, state.media, renderAll));

  var campInput = el("input"); campInput.type="search"; campInput.placeholder="캠페인코드 검색"; campInput.value=state.campaignQuery;
  campInput.addEventListener("input", function(){ state.campaignQuery = campInput.value; renderAll(); });
  field("캠페인 코드", campInput);

  var spendInput = el("input"); spendInput.type="number"; spendInput.min=0; spendInput.step=10000; spendInput.value=state.minSpend;
  spendInput.addEventListener("input", function(){ state.minSpend = +spendInput.value || 0; renderAll(); });
  field("최소 광고비(₩)", spendInput);

  var cmpSel = el("select");
  ["직전 동일 기간","전월","전년 동기"].forEach(function(opt){
    var o = el("option","",opt); o.value = opt; if(opt===state.compare) o.selected = true; cmpSel.appendChild(o);
  });
  cmpSel.addEventListener("change", function(){ state.compare = cmpSel.value; renderAll(); });
  field("비교 기간", cmpSel);

  var resetBtn = el("div","reset-link","필터 초기화");
  resetBtn.addEventListener("click", function(){
    state.start = ALL_MONTHS[0]; state.end = ALL_MONTHS[ALL_MONTHS.length-1];
    state.funnels = ALL_FUNNELS.slice(); state.media = []; state.campaignQuery=""; state.minSpend=0;
    state.compare = "직전 동일 기간";
    buildFiltersUI(); renderAll();
  });
  row.appendChild(resetBtn);
}

function kpiCard(key, value, deltaPct){
  var meta = KPI_META[key];

function diagnosisChip(status){
  var map = {"WORKING":["good","WORKING"],"WATCH":["warning","WATCH"],"NOT WORKING":["critical","NOT WORKING"],"INSUFFICIENT DATA":["insufficient","INSUFFICIENT DATA"]};
  var m = map[status] || map["INSUFFICIENT DATA"];
  return "<span class='chip "+m[0]+"'><span class='dot' style='background:currentColor'></span>"+m[1]+"</span>";
}

function diagnose(row, peerAvg){
  var k = computeKpis(row);
  var clicks = row.clicks||0, spend = row.spend;
  if(clicks>0 && !isNum(row.new_members) && !isNum(row.purchases)){
    return {status:"INSUFFICIENT DATA", summary:"클릭은 발생했으나 신규/구매 데이터가 연결되지 않음",
      evidence:"클릭수 "+fmtCount(clicks)+"건, 신규/구매 데이터 없음", basis:"자사몰 전환 데이터 결합 여부",
      cause:"실제 성과 부진이 아니라 캠페인코드 매칭 실패·추적 누락 가능성", action:"UTM/캠페인코드 표기 일치 여부 점검"};
  }
  var MIN_SPEND=50000, MIN_CLICKS=30;
  if(!(isNum(spend) && spend>=MIN_SPEND) || !(clicks>=MIN_CLICKS)){
    return {status:"INSUFFICIENT DATA", summary:"광고비/클릭 표본이 작아 성과를 단정하기 어려움",
      evidence:"광고비 "+fmtCurrency(spend)+", 클릭수 "+fmtCount(clicks)+"건", basis:"최소 표본 기준(내부 참고 경계값)",
      cause:"표본이 작아 우연에 의한 결과일 가능성 배제 불가", action:"표본 확보 후 재평가"};
  }
  var status="WATCH", summary="평균 수준", cause="-", action="추가 모니터링";
  var basis = "목표 기준 판정 불가(목표값 미설정)";
  if(peerAvg && isNum(peerAvg.roas) && isNum(k.roas)){
    basis += " / 동일 퍼널 평균 ROAS " + fmtPercent(peerAvg.roas);
    if(k.roas >= peerAvg.roas){ status="WORKING"; summary="동일 퍼널 평균 대비 우수"; }
    else if(k.roas < peerAvg.roas*0.7){ status="NOT WORKING"; summary="동일 퍼널 평균 대비 저조"; }
  } else if(peerAvg && isNum(peerAvg.cvr_purchase) && isNum(k.cvr_purchase)){
    // 매출 데이터가 없어 ROAS를 계산할 수 없을 때는 구매 전환율(CVR)로 대체 판정한다.
    basis += " / 동일 퍼널 평균 구매CVR " + fmtPercent(peerAvg.cvr_purchase) + " (매출 데이터 없어 대체)";
    if(k.cvr_purchase >= peerAvg.cvr_purchase){ status="WORKING"; summary="동일 퍼널 평균 대비 구매전환 우수"; }
    else if(k.cvr_purchase < peerAvg.cvr_purchase*0.7){ status="NOT WORKING"; summary="동일 퍼널 평균 대비 구매전환 저조"; }
  }
  if(peerAvg && isNum(peerAvg.ctr) && isNum(peerAvg.cvr_new_member) && isNum(k.ctr) && isNum(k.cvr_new_member)){
    if(k.ctr >= peerAvg.ctr && k.cvr_new_member < peerAvg.cvr_new_member*0.7){
      summary = "광고 반응(CTR)은 양호하나 신규 전환(CVR)이 낮음";
      cause = "랜딩페이지 또는 회원가입 절차 이탈 가능성"; action = "랜딩페이지·가입 퍼널 UX 점검";
      if(status==="WORKING") status="WATCH";
    }
  }
  if(peerAvg && isNum(peerAvg.cpa_new_member) && isNum(peerAvg.cvr_purchase) && isNum(k.cpa_new_member) && isNum(k.cvr_purchase)){
    if(k.cpa_new_member <= peerAvg.cpa_new_member*0.8 && k.cvr_purchase < peerAvg.cvr_purchase*0.7){
      summary = "신규 확보는 효율적이나 구매 전환이 낮음";
      cause = "첫 구매 혜택 부족 또는 구매 전환 장벽"; action = "첫 구매 혜택·전환 프로세스 점검";
    }
  }
  return {status:status, summary:summary,
    evidence:"ROAS "+fmtPercent(k.roas)+" · CTR "+fmtPercent(k.ctr)+" · 신규CVR "+fmtPercent(k.cvr_new_member)+" · 구매CVR "+fmtPercent(k.cvr_purchase),
    basis:basis, cause:cause, action:action};
}

var EVENT_AGG_FIELDS = ["spend","impressions","clicks","video_views","new_members","purchases","revenue"];
function buildCampaignRows(rows){
  var byCode = {};
  rows.forEach(function(r){
    var key = r.campaign_code;
    byCode[key] = byCode[key] || {campaign_code:key, funnel_stage:r.funnel_stage};
    accumulateFields(byCode[key], r, EVENT_AGG_FIELDS);
  });
  return Object.keys(byCode).map(function(k){ return finalizeFields(byCode[k], EVENT_AGG_FIELDS); });
}
function computePeerByFunnel(campaignRows){
  var peerByFunnel = {};
  ALL_FUNNELS.forEach(function(f){
    var fr = campaignRows.filter(function(c){return c.funnel_stage===f && isNum(c.spend);});
    if(!fr.length){ peerByFunnel[f]=null; return; }
    var ks = fr.map(computeKpis);
    function avg(field){ var vs = ks.map(function(k){return k[field];}).filter(isNum); return vs.length? vs.reduce(function(a,b){return a+b;},0)/vs.length : NaN; }
    peerByFunnel[f] = {roas:avg("roas"), ctr:avg("ctr"), cvr_new_member:avg("cvr_new_member"), cvr_purchase:avg("cvr_purchase"), cpa_new_member:avg("cpa_new_member")};
  });
  return peerByFunnel;
}

function diagnosisPanel(rows){
  var p = el("div","panel");
  p.appendChild(el("div","panel-title","📋 Performance Diagnosis"));
  p.appendChild(el("div","panel-sub","목표값 → 동일 퍼널 평균 → 이전 기간 순으로 비교합니다. 목표값 미설정 시 '판정 불가'로 표시. 표본 부족은 INSUFFICIENT DATA로 별도 표시합니다."));

  var campaignRows = buildCampaignRows(rows);

  var topBySpend = campaignRows.filter(function(c){return isNum(c.spend);}).sort(function(a,b){return b.spend-a.spend;}).slice(0,8);

  table.innerHTML = "<thead><tr><th>상태</th><th style='text-align:left'>캠페인코드</th><th style='text-align:left'>퍼널</th><th style='text-align:left'>근거</th><th style='text-align:left'>권장 액션</th></tr></thead>";

    var tr = el("tr");
    tr.innerHTML = "<td>"+diagnosisChip(d.status)+"</td>"+

      "<td style='text-align:left'>"+FUNNEL_LABEL[c.funnel_stage]+"</td>"+

      "<td style='text-align:left; white-space:normal; max-width:220px; color:var(--ink-muted); font-size:12px;'>"+d.action+"</td>";
    tbody.appendChild(tr);

  table.appendChild(tbody);

  return p;
}

function monthlyEventInsights(rows){
  var p = el("div","panel");
  p.appendChild(el("div","panel-title","🗓️ 월별 이벤트 기여 인사이트"));
  p.appendChild(el("div","panel-sub","월별로 동일 퍼널 평균 대비 KPI에 기여한 이벤트(캠페인)와 기여하지 못한 이벤트를 구분합니다. 광고비·클릭 표본이 작은 이벤트는 판정에서 제외됩니다(Performance Diagnosis와 동일 기준)."));

  var peerByFunnel = computePeerByFunnel(buildCampaignRows(rows));
  var months = Array.from(new Set(rows.map(function(r){return r.period_month;}))).sort().reverse();

  if(!months.length){
    p.appendChild(el("div","foot-note","선택 기간에 데이터가 없습니다."));
    return p;
  }

  months.forEach(function(m, idx){
    var mRows = rows.filter(function(r){return r.period_month===m;});
    var mCampaigns = buildCampaignRows(mRows).filter(function(c){return isNum(c.spend);});
    mCampaigns.forEach(function(c){ c.diag = diagnose(c, peerByFunnel[c.funnel_stage]); });
    var contributedAll = mCampaigns.filter(function(c){return c.diag.status==="WORKING";}).sort(function(a,b){return b.spend-a.spend;});
    var notContributedAll = mCampaigns.filter(function(c){return c.diag.status==="NOT WORKING";}).sort(function(a,b){return b.spend-a.spend;});
    var otherCount = mCampaigns.length - contributedAll.length - notContributedAll.length;

    var monthWrap = el("div");
    monthWrap.style.cssText = idx===0 ? "" : "margin-top:16px; padding-top:16px; border-top:1px solid var(--line-strong);";
    monthWrap.appendChild(el("div","", "<b style='font-size:13px;'>"+m.slice(0,7)+"</b>"));

    var cols = el("div","panel-grid"); cols.style.marginTop = "8px";
    var colGood = el("div");
    colGood.appendChild(el("div","", "<span style='color:var(--good); font-weight:700; font-size:12px;'>✅ 기여한 이벤트 ("+contributedAll.length+")</span>"));
    if(contributedAll.length){
      contributedAll.slice(0,5).forEach(function(c){ colGood.appendChild(monthlyEventInsightRow(c)); });
    } else {
      colGood.appendChild(el("div","foot-note","동일 퍼널 평균을 뛰어넘은 이벤트가 없습니다."));
    }
    cols.appendChild(colGood);

    var colBad = el("div");
    colBad.appendChild(el("div","", "<span style='color:var(--critical); font-weight:700; font-size:12px;'>⚠️ 기여하지 못한 이벤트 ("+notContributedAll.length+")</span>"));
    if(notContributedAll.length){
      notContributedAll.slice(0,5).forEach(function(c){ colBad.appendChild(monthlyEventInsightRow(c)); });
    } else {
      colBad.appendChild(el("div","foot-note","동일 퍼널 평균 대비 뚜렷하게 저조한 이벤트가 없습니다."));
    }
    cols.appendChild(colBad);

    monthWrap.appendChild(cols);
    if(otherCount > 0){
      monthWrap.appendChild(el("div","foot-note","그 외 "+otherCount+"건은 평균 수준(WATCH)이거나 표본 부족(INSUFFICIENT DATA)으로 별도 표시하지 않음 — 하단 Performance Diagnosis에서 상세 확인 가능."));
    }
    p.appendChild(monthWrap);
  });

  return p;
}

function renderSortableTable(container, rows, cols, downloadName){
  container.innerHTML = "";
  var sortState = {key: cols[1] ? cols[1][0] : cols[0][0], dir:-1};
  function draw(){
    var sorted = rows.slice().sort(function(a,b){
      var av=a[sortState.key], bv=b[sortState.key];
      if(typeof av === "string") return sortState.dir * av.localeCompare(bv);
      av = isNum(av)?av:-Infinity; bv = isNum(bv)?bv:-Infinity;
      return sortState.dir * (av - bv);
    });
    var wrap = el("div","table-wrap");
    var table = el("table");
    var thead = el("thead"); var trh = el("tr");
    cols.forEach(function(c){
      var th = el("th", c[0]===sortState.key ? "sorted":"");
      th.style.textAlign = c[2]==="text" ? "left" : "right";
      th.innerHTML = c[1] + (c[0]===sortState.key ? "<span class='arrow'>"+(sortState.dir===1?"▲":"▼")+"</span>" : "");
      th.addEventListener("click", function(){
        if(sortState.key===c[0]) sortState.dir *= -1; else { sortState.key=c[0]; sortState.dir=-1; }
        draw();
      });
      trh.appendChild(th);
    });
    thead.appendChild(trh); table.appendChild(thead);
    var tbody = el("tbody");
    sorted.forEach(function(r){
      var tr = el("tr");
      cols.forEach(function(c){
        var v = r[c[0]];
        var td = el("td");
        if(c[2]==="text"){ td.style.textAlign="left"; td.className="code-cell"; td.textContent = v; }
        else { td.textContent = fmtKind(c[2], v); if(!isNum(v)) td.className="num-na"; }
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    wrap.appendChild(table);
    container.innerHTML = "";
    container.appendChild(wrap);
  }
  draw();
}

function toCSV(rows, cols){
  var lines = [cols.map(function(c){return c[1];}).join(",")];
  rows.forEach(function(r){
    lines.push(cols.map(function(c){ var v=r[c[0]]; return typeof v==="string" ? '"'+v.replace(/"/g,'""')+'"' : (isNum(v)?v:""); }).join(","));
  });
  return lines.join("\n");
}
function flashMessage(btn, text){
  var msgEl = btn._msgEl;
  if(!msgEl){
    msgEl = el("span"); msgEl.style.cssText = "margin-left:8px; font-size:11.5px; color:var(--ink-muted);";
    btn.insertAdjacentElement("afterend", msgEl); btn._msgEl = msgEl;
  }
  msgEl.textContent = text;
  clearTimeout(btn._msgTimer);
  btn._msgTimer = setTimeout(function(){ msgEl.textContent = ""; }, 3500);
}
async function downloadCSV(filename, csv, btn){
  var data = "﻿" + csv;
  if(!window.claude || typeof window.claude.use !== "function"){
    flashMessage(btn, "이 보기에서는 다운로드를 지원하지 않습니다.");
    return;
  }
  var downloads;
  try{ downloads = await window.claude.use("downloads"); }catch(e){ downloads = null; }
  if(!downloads){ flashMessage(btn, "이 보기에서는 다운로드가 제공되지 않습니다."); return; }
  try{
    await downloads.save({filename: filename, data: data});
    flashMessage(btn, "다운로드 완료");
  }catch(e){
    var msg = "다운로드를 완료하지 못했습니다.";
    if(e && e.code === "declined") msg = "다운로드가 취소되었습니다.";
    else if(e && e.code === "extension_not_enabled") msg = "CSV 다운로드가 이 보기에서 비활성화되어 있습니다.";
    else if(e && e.code === "rate_limited") msg = "잠시 후 다시 시도해주세요.";
    flashMessage(btn, msg);
  }
}

function multiSelectSimple(options, defaultSelected){

  var api = {node:wrap, onChange:null, getSelected:function(){return selected;}};
  var btn = el("div","msel-btn");
  function refresh(){ btn.innerHTML = "선택 <span class='count'>"+selected.length+"</span>"; }
  refresh();
  var pop = el("div","msel-pop");
  options.forEach(function(opt){
    var o = el("label","msel-opt");
    var cb = el("input"); cb.type="checkbox"; cb.checked = selected.indexOf(opt)!==-1;
    cb.addEventListener("change", function(){
      var idx = selected.indexOf(opt);
      if(cb.checked && idx===-1) selected.push(opt);
      if(!cb.checked && idx!==-1) selected.splice(idx,1);
      refresh(); if(api.onChange) api.onChange();
    });
    o.appendChild(cb); o.appendChild(document.createTextNode(opt));
    pop.appendChild(o);
  });
  btn.addEventListener("click", function(e){ e.stopPropagation(); qa(".msel.open").forEach(function(m){if(m!==wrap)m.classList.remove("open");}); wrap.classList.toggle("open"); });
  document.addEventListener("click", function(){ wrap.classList.remove("open"); });

  wrap.appendChild(btn); wrap.appendChild(pop);
  return api;
}

  rows.forEach(function(r){

    ["total","community","instagram","blog","news"].forEach(function(f){ if(isNum(r[f])) b[f]+=r[f]; });
  });
  return byKey;
}
